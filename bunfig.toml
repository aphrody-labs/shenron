telemetry = false

[install]
linker = "isolated"
globalStore = false
hoist = true
# Only react and react-dom are reachable from the store fallback: swiper (and other packages
# importing react without declaring the peer) resolve them; everything else stays strict.
hoistPattern = ["react", "react-dom"]
saveTextLockfile = true
minimumReleaseAge = 259200
# Owner-published Aphrody packages are pinned exactly and released in step with this repository;
# security fixes (next, nodemailer, undici) track upstream in real time.
# Owner directive 2026-10-25: allow qualified, newly published Bun Video releases.
minimumReleaseAgeExcludes = [
  "@aphrody/bun-video",
  "@aphrody/bun",
  "@aphrody/bun-types",
  "@aphrody/agent-browser",
  "@aphrody/bun-runtime",
  "@aphrody/bun-runtime-sdk",
  "@aphrody/bun-runtime-darwin-aarch64",
  "@aphrody/bun-runtime-linux-aarch64",
  "@aphrody/bun-runtime-linux-x64",
  "@aphrody/bun-runtime-windows-x64",
  "@aphrody/web-test",
  "@aphrody/ag-ui",
  "@aphrody/api",
  "@aphrody/bun-test-dom",
  "@aphrody/discord-kit",
  "@aphrody/http",
  "@aphrody/inference",
  "@aphrody/m3-ai",
  "@aphrody/m3-motion",
  "@aphrody/m3-primitives",
  "@aphrody/m3-reader",
  "@aphrody/m3-theme",
  "@aphrody/m3-tokens",
  "@aphrody/mcp-ui",
  "@aphrody/next-bun",
  "@aphrody/typesafe-sdk",
  "@aphrody/messaging",
  "@aphrody/paths",
  "@aphrody/plugin-opener",
  "@aphrody/runtime-sdk",
  "@aphrody/sql",
  "@aphrody/update",
  "next",
  "@next/env",
  "@next/third-parties",
  "@next/swc-linux-x64-gnu",
  "@next/swc-linux-x64-musl",
  "@next/swc-win32-x64-msvc",
  "@next/swc-darwin-arm64",
  "@next/swc-darwin-x64",
  "@next/swc-linux-arm64-gnu",
  "@next/swc-linux-arm64-musl",
  "@next/swc-win32-arm64-msvc",
  "nodemailer",
  "undici",
]

[run]
# `bun run` exécute toujours Bun, même quand un script ou un binaire déclare un shebang `node`.
bun = true
noOrphans = true

[jsx]
runtime = "automatic"
importSource = "react"

[lint]
config = ".oxlintrc.json"

[fmt]
config = ".oxfmtrc.json"

[test]
onlyFailures = true
