# SPDX-License-Identifier: Apache-2.0
# Shared Cargo configuration of the Shenron workspace (tracked). Nothing here is specific to a
# machine: the compiler cache (RUSTC_WRAPPER=sccache), the job count and the WSL build lock stay
# in the developer's environment or in ~/.cargo/config.toml. See docs/development/rust.md.

# Untracked local overrides (any personal setting), merged over this file.
include = [{ path = "local.toml", optional = true }]

[alias]
# Type-check every crate and target (lib, bins, tests, benches, examples).
ck = "check --workspace --all-targets"
# The CI lint gate: clippy over the workspace, warnings denied.
lint = "clippy --workspace --all-targets -- -D warnings"
# Tests through cargo-nextest (.config/nextest.toml); `cargo t --profile ci` mirrors the CI.
t = "nextest run --workspace"
# Shenron adapters over the in-process Koharu engine (`koharu` feature, off by default).
koharu = "clippy -p shenron-manga -p shenron-cli -p shenron-mcp --all-targets --features shenron-manga/koharu,shenron-cli/koharu,shenron-mcp/koharu -- -D warnings"
koharu-test = "nextest run -p shenron-manga -p shenron-cli -p shenron-mcp --features shenron-manga/koharu,shenron-cli/koharu,shenron-mcp/koharu"
# The WebGPU viewport of Shenron Studio on its browser target (built by
# `bun --filter @aphrody/shenron-koharu build:wasm`).
wasm = "check -p koharu-canvas --lib --target wasm32-unknown-unknown"
# Rustdoc of the workspace crates, without their dependencies.
docs = "doc --workspace --no-deps"

[env]
# Repository root for tests and build scripts reading fixtures shared with the Bun packages
# (`data/`, `packages/*/test/fixtures`). An exported variable of the same name wins.
CARGO_WORKSPACE_DIR = { value = "", relative = true }
# Windows (MSVC ABI, clang-cl through cargo-xwin): libwebp-sys (webp, koharu engine) compiles its
# *_sse41.c sources without -msse4.1 for an MSVC-like compiler, and clang-cl then refuses their
# intrinsics. SSE4.1 is a Windows 11 baseline (x86-64-v2), so it is enabled for the C code of the
# target. An exported CFLAGS_x86_64_pc_windows_msvc wins.
CFLAGS_x86_64_pc_windows_msvc = "-msse4.1"

[net]
# aphrody-labs/aphrody is private: fetch it with the git CLI so its credential helpers and
# `url.<base>.insteadOf` rewrites (SSH locally, a token in CI) apply.
git-fetch-with-cli = true
