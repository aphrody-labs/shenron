# admin. service on prd: its own compose project, never part of the shenron or rosegriffon stacks.
# Secrets stay in $SHENRON_ROOT/config/admin.env (SHENRON_ADMIN_TOKEN, SHENRON_AUTH_URL); nothing inlined.
name: shenron-admin
services:
  admin:
    image: localhost/shenron-admin:${SHENRON_ADMIN_TAG:?SHENRON_ADMIN_TAG is required}
    container_name: shenron-admin
    restart: unless-stopped
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file: ["${SHENRON_ROOT:?set SHENRON_ROOT (see deploy/README.md)}/config/admin.env"]
    environment:
      SHENRON_ADMIN_BIND: 127.0.0.1:5020
      SHENRON_SITE_URL: http://127.0.0.1:5011
      SHENRON_BOT_URL: http://127.0.0.1:5006
      SHENRON_ADMIN_PANELS_DIR: /etc/shenron/admin-panels
    volumes:
      - "${SHENRON_ROOT:?set SHENRON_ROOT (see deploy/README.md)}/config/admin-panels:/etc/shenron/admin-panels:ro"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5020/api/health"]
      interval: 15s
      timeout: 3s
      retries: 5
