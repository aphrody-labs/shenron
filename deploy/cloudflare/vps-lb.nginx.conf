# Managed by scripts/deploy/quota-guard.ts — loaded inside server/upstream config on fr2 (bunos).
# FinOps Quota Shield for dragonballfr.com:
# - Uses fr2 NVMe proxy cache + Cloudflare R2 + prd WireGuard overflow BEFORE Vercel/Neon/Cloudflare free quotas.
# - Upstream bridge ports:
#   127.0.0.1:18081 -> Vercel Fluid Compute (fra1: https://shenron-site.vercel.app)
#   127.0.0.1:18082 -> VPS prd warm standby / heavy offload (WireGuard: https://10.200.77.5:443)

proxy_cache_path /var/cache/nginx/shenron_ssr levels=1:2 keys_zone=shenron_ssr:32m max_size=2g inactive=60m use_temp_path=off;
proxy_cache_path /var/cache/nginx/shenron_img levels=1:2 keys_zone=shenron_img:32m max_size=4g inactive=30d use_temp_path=off;
proxy_cache_path /var/cache/nginx/shenron_static levels=1:2 keys_zone=shenron_static:16m max_size=2g inactive=30d use_temp_path=off;

map $http_cookie $shenron_bypass_cache {
    default 0;
    "~*better-auth" 1;
    "~*__Secure-better-auth" 1;
    "~*shenron_session" 1;
}

map $http_accept $shenron_img_accept {
    default "orig";
    "~*image/avif" "avif";
    "~*image/webp" "webp";
}

# Local TLS-bridged upstreams so mixed SNI (Vercel vs prd WireGuard) balances cleanly with passive health checks.
server {
    listen 127.0.0.1:18081;
    server_name _;
    resolver 1.1.1.1 8.8.8.8 valid=60s;
    location / {
        set $vercel_origin "198a55119ab08da9.vercel-dns-017.com";
        proxy_pass https://$vercel_origin;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name dragonballfr.com;
        proxy_ssl_verify off;
        proxy_set_header Host dragonballfr.com;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}

server {
    listen 127.0.0.1:18082;
    server_name _;
    location / {
        proxy_pass https://10.200.77.5:443;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name dragonballfr.com;
        proxy_ssl_verify off;
        proxy_set_header Host dragonballfr.com;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}

upstream shenron_app_pool {
    include /etc/nginx/conf.d/shenron-upstream-weights.inc;
    keepalive 32;
}

upstream shenron_vps_offload {
    server 127.0.0.1:18082 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:18081 backup;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name dragonballfr.com www.dragonballfr.com;
    return 301 https://dragonballfr.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.dragonballfr.com;
    ssl_certificate /etc/letsencrypt/live/dragonballfr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dragonballfr.com/privkey.pem;
    return 301 https://dragonballfr.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dragonballfr.com;

    ssl_certificate /etc/letsencrypt/live/dragonballfr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dragonballfr.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 1. Static chunks & CDN media: served/cached off Cloudflare R2 CDN without hitting Vercel quotas.
    location ~* ^/(_next/static|assets|db|media|banners|og|fonts)/ {
        proxy_pass https://cdn.dragonballfr.com;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name cdn.dragonballfr.com;
        proxy_set_header Host cdn.dragonballfr.com;
        proxy_cache shenron_static;
        proxy_cache_valid 200 7d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Shenron-LB-Cache $upstream_cache_status always;
    }

    # 2. Image optimizer offload: cached 30d on fr2 NVMe + computed on prd (0 Vercel Image quota burned).
    location = /_next/image {
        proxy_pass http://shenron_vps_offload;
        proxy_http_version 1.1;
        proxy_set_header Host dragonballfr.com;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Accept $http_accept;
        proxy_cache shenron_img;
        proxy_cache_key "$scheme$host$request_uri|$shenron_img_accept";
        proxy_cache_valid 200 30d;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Shenron-Img-Cache $upstream_cache_status always;
    }

    # 3. Heavy / stateful / bulk endpoints routed to VPS prd (0 Vercel CPU/bandwidth drain).
    location ~* ^/(api/public/dbxv2/|api/media/|api/studio/|api/admin/|api/wiki-admin/|workshop/|admin/) {
        proxy_pass http://shenron_vps_offload;
        proxy_http_version 1.1;
        proxy_set_header Host dragonballfr.com;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # 4. Authenticated / dynamic API & SSR bypass NVMe cache cleanly and balance Vercel <-> prd.
    location ~* ^/api/ {
        proxy_pass http://shenron_app_pool;
        proxy_http_version 1.1;
        proxy_set_header Host dragonballfr.com;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header X-Shenron-Upstream $upstream_addr always;
    }

    # 5. Public SSR/ISR pages: fr2 NVMe micro-cache absorbs crawlers & traffic spikes before Vercel/Neon.
    location / {
        proxy_pass http://shenron_app_pool;
        proxy_http_version 1.1;
        proxy_set_header Host dragonballfr.com;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_cache shenron_ssr;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_cache_bypass $shenron_bypass_cache $arg_nocache;
        proxy_no_cache $shenron_bypass_cache;
        proxy_cache_valid 200 10m;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Shenron-LB-Cache $upstream_cache_status always;
        add_header X-Shenron-Upstream $upstream_addr always;
    }
}
