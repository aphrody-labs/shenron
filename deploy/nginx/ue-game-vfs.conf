# deploy/nginx/ue-game-vfs.conf
#
# High-Performance Nginx VFS & Asset Streaming Configuration for Unreal Engine Web Games
# Supports 5.4 GB+ PAK containers with 8 MB Byte-Range Slicing, HTTP/3 QUIC, and WebAssembly Threading.

proxy_cache_path /var/cache/nginx/ue_vfs levels=1:2 keys_zone=ue_vfs_cache:128m max_size=40g inactive=30d use_temp_path=off;

server {
    listen 443 ssl quic reuseport;
    listen 443 ssl http2;
    server_name cdn.dragonballfr.com;

    # SSL / TLS 1.3 Configuration
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HTTP/3 QUIC Advertisement
    add_header Alt-Svc 'h3=":443"; ma=86400';

    # Chromium Low-Level Gaming Headers (WebAssembly SIMD, Memory64 & WebGPU Subgroups)
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range, If-Match, If-Modified-Since, Content-Type" always;
    add_header Access-Control-Expose-Headers "Content-Range, Content-Length, ETag, Accept-Ranges" always;

    # Root for Content-Addressed Objects (_objects/<sha256>) & VFS chunks
    root /srv/shenron/cdn;

    # 1. Byte-Range Slicing for Massive UE4/UE5 Pak Containers (e.g., pakchunk0 5.4 GB)
    location ~* \.(pak|sig|bin|dat|cpk)$ {
        slice 8m;
        proxy_cache ue_vfs_cache;
        proxy_cache_key $uri$slice_range;
        proxy_set_header Range $slice_range;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_cache_valid 200 206 365d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;

        # Direct streaming to browser without disk buffering
        proxy_buffering on;
        proxy_buffers 16 256k;
        proxy_busy_buffers_size 512k;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-VFS-Slice $slice_range always;
        add_header X-Cache-Status $upstream_cache_status always;

        try_files $uri @upstream_garage_s3;
    }

    # 2. WebAssembly Streaming Acceleration (.wasm)
    location ~* \.wasm$ {
        types {
            application/wasm wasm;
        }
        default_type application/wasm;

        gzip_static on;
        brotli_static on;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Type "application/wasm" always;
        try_files $uri @upstream_garage_s3;
    }

    # 3. Upstream fallback to Garage S3 / Cloudflare R2
    location @upstream_garage_s3 {
        proxy_pass http://10.200.77.3:3900; # Garage S3 Gateway on cdn node
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
