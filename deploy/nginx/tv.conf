# tv.dragonballfr.com -> shenron-tv (127.0.0.1:8793). Installed in /srv/shenron/config/nginx/ on the
# production host (copied into every release by deploy/activation/activate.sh); Next.js routes are untouched.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tv.dragonballfr.com;
    ssl_certificate /etc/letsencrypt/live/dragonballfr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dragonballfr.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /hls/ {
        proxy_pass http://127.0.0.1:8793;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering on;
    }

    location / {
        proxy_pass http://127.0.0.1:8793;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
