# koharu.dragonballfr.com on the gateway (wildcard certificate): proxies to koharu-web on loopback.
# Separate conf.d file: the Next.js vhosts and routes are not touched.
upstream upstream_koharu { server 127.0.0.1:8890; keepalive 8; }

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name koharu.dragonballfr.com;
    ssl_certificate /etc/letsencrypt/live/dragonballfr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dragonballfr.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 40m;

    location / {
        proxy_pass http://upstream_koharu;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }
}
