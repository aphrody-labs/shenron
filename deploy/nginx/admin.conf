# admin.dragonballfr.com vhost for shenron-gateway; installed as conf.d/zz-admin.conf. The Next.js routes are untouched.
upstream upstream_admin { server 127.0.0.1:5020; keepalive 16; }
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.dragonballfr.com;
    ssl_certificate /etc/letsencrypt/live/dragonballfr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dragonballfr.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    location / {
        proxy_pass http://upstream_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
