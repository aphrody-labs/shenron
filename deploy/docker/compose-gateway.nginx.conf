# SPDX-License-Identifier: Apache-2.0
# Compose variant of all-in-one/nginx.conf: upstreams resolve to the server and bot services.
# Nginx configuration for the complete Shenron all-in-one container.
# Proxies public traffic to the internal loopback services:
# - Shenron Server (Site, Studio, Desktop, MCP, API): 127.0.0.1:5011
# - Shenron Bot API: 127.0.0.1:5006
# - CDN static cache: /srv/shenron-cdn

worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    types {
        application/manifest+json webmanifest;
        text/javascript mjs;
    }

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Upstreams: Docker DNS, resolved at runtime so the opt-in bot may be absent.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream upstream_site {
        zone upstream_site 64k;
        server server:5011 resolve;
        keepalive 64;
    }

    upstream upstream_bot {
        zone upstream_bot 64k;
        server bot:5006 resolve;
        keepalive 32;
    }

    # Default server (handles direct IP access or localhost)
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Client body limit for editor uploads & studio
        client_max_body_size 64m;

        # CDN static files fallback
        location /assets/ {
            alias /srv/shenron-cdn/assets/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
            try_files $uri @cdn_worker_assets;
        }

        location ^~ /wiki/media/ {
            alias /srv/shenron-cdn/wiki/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
            try_files $uri @cdn_worker;
        }

        # Reader pages use /wiki/... for owned databook images. Keep normal
        # encyclopedia routes in Next; only image-like paths fall through to CDN.
        location ~* ^/wiki/.+\.(?:avif|gif|jpe?g|png|svg|webp)$ {
            root /srv/shenron-cdn;
            expires 30d;
            add_header Cache-Control "public, no-transform";
            try_files $uri @cdn_worker;
        }

        # Only /assets/ may fall through to the public Shenron VFS.
        location @cdn_worker_assets {
            proxy_intercept_errors on;
            error_page 404 429 500 502 503 504 = @cdn_public_origin_assets;
            proxy_pass https://shenron-cdn.aphrody-labs.workers.dev;
            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_ssl_name shenron-cdn.aphrody-labs.workers.dev;
            proxy_pass_request_headers off;
            proxy_set_header Host shenron-cdn.aphrody-labs.workers.dev;
            proxy_set_header Accept $http_accept;
            proxy_set_header Range $http_range;
            proxy_set_header If-None-Match $http_if_none_match;
            proxy_set_header If-Modified-Since $http_if_modified_since;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
        location @cdn_public_origin_assets {
            proxy_intercept_errors on;
            error_page 404 = @vfs_asset;
            proxy_pass http://10.200.77.1;
            proxy_pass_request_headers off;
            proxy_set_header Host shenron-cdn-origin.internal;
            proxy_set_header Range $http_range;
            proxy_set_header If-None-Match $http_if_none_match;
            proxy_set_header If-Modified-Since $http_if_modified_since;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
        # The public custom CDN hostname can be unavailable while its DNS/TLS
        # cutover is pending. Serve verified objects from the Worker by path,
        # without forwarding browser credentials or cookies.
        location @cdn_public_origin {
            proxy_pass http://10.200.77.1;
            proxy_pass_request_headers off;
            proxy_set_header Host shenron-cdn-origin.internal;
            proxy_set_header Range $http_range;
            proxy_set_header If-None-Match $http_if_none_match;
            proxy_set_header If-Modified-Since $http_if_modified_since;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
        location @vfs_asset {
            # Keep the SQLite VFS inside the application process. Never mount or
            # expose its backing file through Nginx; only relay the requested asset.
            proxy_pass http://upstream_site;
            proxy_http_version 1.1;
            proxy_pass_request_headers off;
            proxy_set_header Host $host;
            proxy_set_header Accept $http_accept;
            proxy_set_header Range $http_range;
            proxy_set_header If-None-Match $http_if_none_match;
            proxy_set_header If-Modified-Since $http_if_modified_since;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
        location @cdn_worker {
            proxy_intercept_errors on;
            error_page 404 429 500 502 503 504 = @cdn_public_origin;
            proxy_pass https://shenron-cdn.aphrody-labs.workers.dev;
            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_ssl_name shenron-cdn.aphrody-labs.workers.dev;
            proxy_pass_request_headers off;
            proxy_set_header Host shenron-cdn.aphrody-labs.workers.dev;
            proxy_set_header Accept $http_accept;
            proxy_set_header Range $http_range;
            proxy_set_header If-None-Match $http_if_none_match;
            proxy_set_header If-Modified-Since $http_if_modified_since;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        # Bot API routing
        location /api/bot/ {
            proxy_pass http://upstream_bot/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Shenron MCP routing
        location /mcp {
            proxy_pass http://upstream_site/mcp;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        # All other traffic goes to Shenron Server (Site, Studio, Desktop)
        location / {
            try_files $uri @proxy_site;
        }

        location @proxy_site {
            proxy_pass http://upstream_site;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
    }

    # Bot vhost
    server {
        listen 80;
        listen [::]:80;
        server_name bot.dragonballfr.com;

        location / {
            proxy_pass http://upstream_bot;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # CDN vhost
    server {
        listen 80;
        listen [::]:80;
        server_name cdn.dragonballfr.com;
        root /srv/shenron-cdn/site;

        location / {
            expires 30d;
            add_header Access-Control-Allow-Origin *;
            add_header Cache-Control "public, max-age=2592000, immutable";
            try_files $uri @cdn_worker;
        }

        location @cdn_public_origin {
            proxy_pass http://10.200.77.1;
            proxy_pass_request_headers off;
            proxy_set_header Host shenron-cdn-origin.internal;
            proxy_set_header Range $http_range;
            proxy_set_header If-None-Match $http_if_none_match;
            proxy_set_header If-Modified-Since $http_if_modified_since;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
        location @cdn_worker {
            proxy_intercept_errors on;
            error_page 404 429 500 502 503 504 = @cdn_public_origin;
            proxy_pass https://shenron-cdn.aphrody-labs.workers.dev;
            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_ssl_name shenron-cdn.aphrody-labs.workers.dev;
            proxy_pass_request_headers off;
            proxy_set_header Host shenron-cdn.aphrody-labs.workers.dev;
            proxy_set_header Accept $http_accept;
            proxy_set_header Range $http_range;
            proxy_set_header If-None-Match $http_if_none_match;
            proxy_set_header If-Modified-Since $http_if_modified_since;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name cdn.dragonballfr.com;
        root /srv/shenron-cdn/site;

        ssl_certificate /etc/letsencrypt/live/cdn.dragonballfr.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/cdn.dragonballfr.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            expires 30d;
            add_header Access-Control-Allow-Origin *;
            add_header Cache-Control "public, max-age=2592000, immutable";
            try_files $uri =404;
        }
    }

# BEGIN APHRODY NATIVE SITE v1
upstream aphrody_native_site {
    server host.docker.internal:36515;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost 127.0.0.1 aphrody.local aphrody.com www.aphrody.com;

    location / {
        proxy_pass http://aphrody_native_site;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }
}

# END APHRODY NATIVE SITE v1
}
