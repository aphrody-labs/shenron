# SPDX-License-Identifier: Apache-2.0
# Nginx configuration for the complete Shenron all-in-one container.
# Proxies public traffic to the internal loopback services:
# - Shenron Server (Site, Studio, Desktop, MCP, API): 127.0.0.1:5011
# - Shenron Bot API: 127.0.0.1:5006
# - CDN static cache: /srv/shenron-cdn

worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    types {
        application/manifest+json webmanifest;
        text/javascript mjs;
    }

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Upstreams
    upstream upstream_site {
        server 127.0.0.1:5011;
        keepalive 64;
    }

    upstream upstream_bot {
        server 127.0.0.1:5006;
        keepalive 32;
    }

    # Default server (handles direct IP access or localhost)
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Client body limit for editor uploads & studio
        client_max_body_size 64m;

        # CDN static files fallback
        location /assets/ {
            alias /srv/shenron-cdn/assets/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
            try_files $uri @proxy_site;
        }

        location /wiki/media/ {
            alias /srv/shenron-cdn/wiki/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
            try_files $uri @proxy_site;
        }

        # Bot API routing
        location /api/bot/ {
            proxy_pass http://upstream_bot/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Shenron MCP routing
        location /mcp {
            proxy_pass http://upstream_site/mcp;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        # All other traffic goes to Shenron Server (Site, Studio, Desktop)
        location / {
            try_files $uri @proxy_site;
        }

        location @proxy_site {
            proxy_pass http://upstream_site;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
    }

    # Bot vhost
    server {
        listen 80;
        listen [::]:80;
        server_name bot.dragonballfr.com;

        location / {
            proxy_pass http://upstream_bot;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # CDN vhost
    server {
        listen 80;
        listen [::]:80;
        server_name cdn.dragonballfr.com;
        root /srv/shenron-cdn/site;

        location / {
            expires 30d;
            add_header Access-Control-Allow-Origin *;
            add_header Cache-Control "public, max-age=2592000, immutable";
            try_files $uri @cdn_worker;
        }

        location @cdn_worker {
            proxy_pass https://shenron-cdn.aphrody-labs.workers.dev;
            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_ssl_name shenron-cdn.aphrody-labs.workers.dev;
            proxy_pass_request_headers off;
            proxy_set_header Host shenron-cdn.aphrody-labs.workers.dev;
            proxy_set_header Accept $http_accept;
            proxy_set_header Range $http_range;
            proxy_set_header If-None-Match $http_if_none_match;
            proxy_set_header If-Modified-Since $http_if_modified_since;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name cdn.dragonballfr.com;
        root /srv/shenron-cdn/site;

        ssl_certificate /etc/letsencrypt/live/cdn.dragonballfr.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/cdn.dragonballfr.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            expires 30d;
            add_header Access-Control-Allow-Origin *;
            add_header Cache-Control "public, max-age=2592000, immutable";
            try_files $uri =404;
        }
    }
}
