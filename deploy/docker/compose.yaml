# SPDX-License-Identifier: Apache-2.0
# Application containers only. PostgreSQL, Redis, nginx and CDN remain Infra-owned services.
name: shenron
services:
  site:
    image: localhost/shenron:${SHENRON_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        SHENRON_REVISION: ${SHENRON_REVISION:-unknown}
    entrypoint: ["/usr/local/bin/shenron-server"]
    command: ["serve", "--host", "127.0.0.1", "--port", "5011"]
    env_file:
      - ${SHENRON_SITE_ENV_FILE:-${SHENRON_ENV_DIR:-/etc/rose-griffon}/shenron-site.env}
      - ${SHENRON_COMPUTE_CLIENT_ENV_FILE:-/etc/aphrody/shenron-compute-client.env}
    environment:
      SHENRON_HOME: /var/lib/shenron
      A2A_COORD_DIR: /var/lib/shenron/data/a2a
      SHENRON_PROFILE: production
      SHENRON_FFI_LIB: /usr/local/lib/libshenron_ffi.so
      SHENRON_VFS_DB: /var/lib/shenron/data/shenron-vfs.sqlite
      HOSTNAME: 127.0.0.1
      PORT: "5011"
      NEXT_TELEMETRY_DISABLED: "1"
      SHENRON_RELEASES_DIR: /srv/shenron/shared/releases
    network_mode: host
    user: "${SHENRON_UID:-1000}:${SHENRON_GID:-1000}"
    init: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - type: bind
        source: ${SHENRON_SHARED_ROOT:-/srv/shenron/shared}/server
        target: /var/lib/shenron
      - type: bind
        source: ${SHENRON_SHARED_ROOT:-/srv/shenron/shared}/releases
        target: /srv/shenron/shared/releases
        read_only: true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5011/api/local/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 4g
    memswap_limit: 4g
    pids_limit: 1024
    stop_grace_period: 20s
    restart: unless-stopped

  bot:
    image: localhost/shenron:${SHENRON_IMAGE_TAG:-local}
    entrypoint: ["/usr/local/bin/shenron-bot"]
    env_file:
      - ${SHENRON_BOT_ENV_FILE:-${SHENRON_ENV_DIR:-/etc/rose-griffon}/shenron-bot.env}
      - ${SHENRON_COMPUTE_CLIENT_ENV_FILE:-/etc/aphrody/shenron-compute-client.env}
      - path: ${SHENRON_WEB_CRAWL_ENV_FILE:-/etc/aphrody/shenron-web-crawl.env}
        required: false
    environment:
      SHENRON_PROFILE: production
      API_HOST: 127.0.0.1
      API_PORT: "5006"
      DATABASE_PATH: /app/data/bot.db
      SHENRON_FFI_LIB: /usr/local/lib/libshenron_ffi.so
      SHENRON_ADMIN_PIPELINE_HOME: /app/data/admin-web-pipeline
    network_mode: host
    user: "${SHENRON_UID:-1000}:${SHENRON_GID:-1000}"
    init: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - type: bind
        source: ${SHENRON_SHARED_ROOT:-/srv/shenron/shared}/bot/data
        target: /app/data
      - type: bind
        source: ${SHENRON_SHARED_ROOT:-/srv/shenron/shared}/bot/assets
        target: /app/assets
        read_only: true
      - type: bind
        source: ${SHENRON_WEB_CRAWL_CONFIG_DIR:-/etc/aphrody/shenron-web-crawl}
        target: /run/aphrody/web-crawl
        read_only: true
        bind:
          create_host_path: true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5006/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 512
    stop_grace_period: 15s
    restart: unless-stopped
