# Isolated workstation dependencies for local Shenron development.
name: shenron-local

services:
  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    shm_size: 1g
    environment:
      POSTGRES_DB: shenron_site
      POSTGRES_USER: shenron
      POSTGRES_PASSWORD: shenron_local_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shenron -d shenron_site"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [local]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [local]

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.local-gateway
    image: shenron-local-gateway:dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - cdn_data:/srv/shenron-cdn:ro
    networks: [local]

networks:
  local:
    name: shenron-local

volumes:
  postgres_data:
    name: shenron-local-postgres
  redis_data:
    name: shenron-local-redis
  cdn_data:
    name: shenron-local-cdn
