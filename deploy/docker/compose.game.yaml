# SPDX-License-Identifier: Apache-2.0
# Infra consumes this service in an unsealed candidate; never activate alone.
services:
  game:
    image: ${SHENRON_GAME_IMAGE:?immutable site image ID required}
    entrypoint: ["/usr/local/bin/shenron-server"]
    command: ["serve", "--host", "127.0.0.1", "--port", "5013"]
    environment:
      SHENRON_HOME: /var/lib/shenron-game
      SHENRON_PROFILE: public
      SHENRON_SITE_SURFACE: game
      SHENRON_SITE_URL: https://dragonballfr.com
      SHENRON_PUBLIC_SITE_URL: https://dragonballfr.com
      SHENRON_PUBLIC_GAME_URL: https://play.dragonballfr.com
      PORT: "5013"
      HOSTNAME: 127.0.0.1
      NEXT_TELEMETRY_DISABLED: "1"
    network_mode: host
    user: "10001:10001"
    init: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/lib/shenron-game:rw,nosuid,uid=10001,gid=10001,size=1g
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:5013/api/local/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    restart: unless-stopped
