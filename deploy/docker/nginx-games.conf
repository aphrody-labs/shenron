# Nginx Edge Cache & Range-Request Gateway for Dragon Ball Games (R2 + Emulators)

proxy_cache_path /var/cache/nginx/games
    levels=1:2
    keys_zone=games_cache:64m
    max_size=20g
    inactive=30d
    use_temp_path=off;

# 4MB Slice buffer for streaming multi-gigabyte ISO / RVZ / CHD files without memory spikes
map $http_range $slice_range {
    default $http_range;
    ""      "bytes=0-";
}

server {
    listen 80;
    listen [::]:80;
    server_name games.dragonballfr.com cdn-games.dragonballfr.com;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Gzip & Static compression
    gzip on;
    gzip_types application/json application/javascript text/css application/wasm;
    gzip_min_length 1024;

    # Mandatory WebAssembly Cross-Origin Isolation Headers
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range, If-Range, Content-Type" always;
    add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Accept-Ranges, ETag" always;

    # Pre-flight OPTIONS
    if ($request_method = OPTIONS) {
        return 204;
    }

    # API Proxy to Dragon Ball Games Manager daemon (Bun v1.4.4)
    location /api/ {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache off;
    }

    # Health check
    location = /healthz {
        proxy_pass http://127.0.0.1:3030/healthz;
        proxy_cache off;
    }

    # Cloudflare R2 Stream & Slice Cache for Game Images (.rvz, .iso, .chd, .gba, .nds, .sfc)
    location /games/ {
        proxy_pass http://127.0.0.1:3030/games/;
        
        # Byte-range slice caching
        slice 4m;
        proxy_cache games_cache;
        proxy_cache_key $uri$is_args$args$slice_range;
        proxy_set_header Range $slice_range;

        proxy_cache_valid 200 206 30d;
        proxy_cache_valid 301 302 1h;
        proxy_cache_valid 404 1m;

        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;

        # Upstream headers
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_ignore_headers Set-Cookie;
        proxy_hide_header Set-Cookie;

        # Browser caching for immutable game ROMs and discs
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Cache-Status $upstream_cache_status always;
    }
}
