# TLS vhost for the CDN when the gateway terminates Cloudflare origin TLS.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cdn.dragonballfr.com;
    root /srv/shenron-cdn/site;

    ssl_certificate /etc/letsencrypt/live/cdn.dragonballfr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cdn.dragonballfr.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Release chunks are served by the active site even if the CDN mirror lags.
    location ^~ /_next/static/ {
        root /srv/shenron-cdn;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri @release_static;
    }

    location @release_static {
        proxy_pass http://127.0.0.1:5011;
        proxy_set_header Host dragonballfr.com;
        proxy_pass_request_headers off;
    }

    location / {
        expires 30d;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri @cdn_worker;
    }

    location @cdn_worker {
        proxy_intercept_errors on;
        error_page 404 429 500 502 503 504 = @cdn_public_origin;
        proxy_pass https://shenron-cdn.aphrody-labs.workers.dev;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name shenron-cdn.aphrody-labs.workers.dev;
        proxy_pass_request_headers off;
        proxy_set_header Host shenron-cdn.aphrody-labs.workers.dev;
        proxy_set_header Accept $http_accept;
        proxy_set_header Range $http_range;
        proxy_set_header If-None-Match $http_if_none_match;
        proxy_set_header If-Modified-Since $http_if_modified_since;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Infra exposes only public reader images on the private mesh.
    location @cdn_public_origin {
        proxy_pass http://10.200.77.1;
        proxy_pass_request_headers off;
        proxy_set_header Host shenron-cdn-origin.internal;
        proxy_set_header Range $http_range;
        proxy_set_header If-None-Match $http_if_none_match;
        proxy_set_header If-Modified-Since $http_if_modified_since;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
