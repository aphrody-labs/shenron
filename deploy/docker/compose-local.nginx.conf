# SPDX-License-Identifier: Apache-2.0
worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    server_tokens off;

    server {
        listen 80;
        server_name localhost;
        client_max_body_size 64m;

        location = /__cdn_health {
            proxy_pass https://shenron-cdn.aphrody-labs.workers.dev/health;
            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_ssl_name shenron-cdn.aphrody-labs.workers.dev;
            proxy_pass_request_headers off;
            proxy_set_header Host shenron-cdn.aphrody-labs.workers.dev;
            proxy_set_header Accept $http_accept;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
        }

        location /assets/ {
            alias /srv/shenron-cdn/assets/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
            try_files $uri @cdn_worker;
        }

        location /wiki/media/ {
            alias /srv/shenron-cdn/wiki/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
            try_files $uri @cdn_worker;
        }

        location @cdn_worker {
            proxy_pass https://shenron-cdn.aphrody-labs.workers.dev;
            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_ssl_name shenron-cdn.aphrody-labs.workers.dev;
            proxy_pass_request_headers off;
            proxy_set_header Host shenron-cdn.aphrody-labs.workers.dev;
            proxy_set_header Accept $http_accept;
            proxy_set_header Range $http_range;
            proxy_set_header If-None-Match $http_if_none_match;
            proxy_set_header If-Modified-Since $http_if_modified_since;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        location / {
            proxy_pass http://host.docker.internal:5011;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
    }
}
