# SPDX-License-Identifier: Apache-2.0
# Install in the unsealed Infra candidate after the certificate is projected.
server {
    listen 80;
    listen [::]:80;
    server_name play.dragonballfr.com game-api.dragonballfr.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name play.dragonballfr.com;
    ssl_certificate /etc/letsencrypt/live/dragonballfr-game/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dragonballfr-game/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    location = /api/catalog {
        proxy_pass http://127.0.0.1:5011;
        proxy_set_header Host dragonballfr.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Accept $http_accept;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header If-None-Match $http_if_none_match;
        proxy_set_header If-Modified-Since $http_if_modified_since;
        proxy_cache off;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_hide_header Set-Cookie;
    }
    location = /api/public/dbxv2/cpk {
        proxy_pass http://127.0.0.1:5011;
        proxy_set_header Host dragonballfr.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Accept $http_accept;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header If-None-Match $http_if_none_match;
        proxy_set_header If-Modified-Since $http_if_modified_since;
        proxy_cache off;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_hide_header Set-Cookie;
    }
    location ^~ /api/public/dbxv2/cpk/ {
        proxy_pass http://127.0.0.1:5011;
        proxy_set_header Host dragonballfr.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Accept $http_accept;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header If-None-Match $http_if_none_match;
        proxy_set_header If-Modified-Since $http_if_modified_since;
        proxy_cache off;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_hide_header Set-Cookie;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
    location /api/ { return 404; }
    location / {
        proxy_pass http://127.0.0.1:5013;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}

