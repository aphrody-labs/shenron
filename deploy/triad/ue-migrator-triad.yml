# deploy/triad/ue-migrator-triad.yml
#
# Sovereign Fleet Triad Resource Allocation for Unreal Engine to Web Migration
# Interconnected over private WireGuard mesh (10.200.77.0/24) with Zstd image streaming.

services:
  # ============================================================================
  # Node 1: VPS Build & RE Hub (10.200.77.1 / 51.77.147.152)
  # Role: 12-Core Heavy Compilation, Disassembly (depot-re, iced-x86), Python Magika ML
  # ============================================================================
  ue-re-worker:
    image: localhost/shenron-re-worker:latest
    container_name: shenron-ue-re-worker
    network_mode: host
    environment:
      - RUSTC_WRAPPER=sccache
      - SCCACHE_DIR=/root/.cache/sccache
      - MAGIKA_MODEL_DIR=/srv/shenron/models/magika
      - DEPOT_CLI_PATH=/usr/local/bin/depot
      - WIRE_GUARD_PEER_CDN=10.200.77.3
      - WIRE_GUARD_PEER_PROD=10.200.77.5
    deploy:
      resources:
        limits:
          cpus: "11.5"
          memory: 24G
        reservations:
          cpus: "8.0"
          memory: 12G
    volumes:
      - /srv/shenron/sccache:/root/.cache/sccache
      - /srv/shenron/staging:/srv/shenron/staging
      - /srv/shenron/models:/srv/shenron/models
    restart: unless-stopped

  # ============================================================================
  # Node 2: CDN Edge Gateway Simulator (10.200.77.3 / 51.255.162.6)
  # Role: Nginx VFS Slicing (8MB Chunks), Garage S3 R2, Pingora Gateway, Workerd
  # ============================================================================
  ue-vfs-edge:
    image: localhost/shenron-vfs-edge:latest
    container_name: shenron-ue-vfs-edge
    network_mode: host
    environment:
      - GARAGE_RPC_PORT=3901
      - GARAGE_S3_PORT=3900
      - NGINX_SLICE_SIZE=8m
      - R2_BUCKET=shenron-cdn
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
        reservations:
          cpus: "2.0"
          memory: 4G
    volumes:
      - /srv/shenron/cdn:/srv/shenron/cdn
      - /var/cache/nginx/ue_vfs:/var/cache/nginx/ue_vfs
      - ./deploy/nginx/ue-game-vfs.conf:/etc/nginx/conf.d/ue-game-vfs.conf:ro
    restart: unless-stopped

  # ============================================================================
  # Node 3: Bare-Metal Production Host (10.200.77.5 / 72.60.186.43)
  # Role: Next.js 16 Standalone Server, WebRTC Rollback Netcode Relay, Redis Telemetry
  # ============================================================================
  ue-game-server:
    image: localhost/shenron-site:latest
    container_name: shenron-site-prod
    network_mode: host
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_URL=redis://127.0.0.1:6379
      - PGURL=postgres://shenron:production@127.0.0.1:5432/shenron
      - NEXT_PUBLIC_CDN_URL=https://cdn.dragonballfr.com
    deploy:
      resources:
        limits:
          cpus: "8.0"
          memory: 26G
        reservations:
          cpus: "4.0"
          memory: 8G
    volumes:
      - /srv/shenron/var:/srv/shenron/var
    restart: unless-stopped
