# Naming declaration of this repository (scheme: aphrody-labs/.github naming/NAMING.md). Names come from here, never from another repository.
id = "shenron"
kind = "app"
org = "aphrody-labs"

[names]
npm_scope = "@aphrody"      # workspace packages are @aphrody/shenron-<unit>
crate_prefix = "shenron-"
env_prefix = "SHENRON_"

[legacy]
# koharu-* (Shenron Studio) and dragon-pixel (published as dragon-pixel-engine) are on crates.io under these names, which stay.
crates = ["koharu-", "dragon-pixel"]
# Variables of the upstream yolo-web tool, read only as an alias of their SHENRON_YOLO_WEB_* name.
env = ["YOLO_WEB_"]
