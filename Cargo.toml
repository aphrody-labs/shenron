# SPDX-License-Identifier: Apache-2.0
# Shenron Rust workspace: the shenron CLI, MCP server, C ABI, studio commands,
# desktop app and the Koharu manga translation engine (crates/koharu-*).
# Aphrody capabilities (ML runtime, RAG, OCR, models, Tauri 3 fork) come from
# aphrody-labs/aphrody pinned by revision until they are published on crates.io;
# `[workspace.dependencies]` is generated by scripts/build/rust/workspace-deps.ts.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.3.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
authors = ["aphrody-dev <contact@aphrody.com>"]
homepage = "https://dragonballfr.com"
repository = "https://github.com/aphrody-labs/shenron"

[workspace.dependencies]
# Shenron-owned: used only by the Koharu engine and the desktop (not in Aphrody's workspace).
alphanumeric-sort = "1.5.8"
eventsource-stream = "0.2.3"
fast_image_resize = { version = "6.1.0", features = ["image", "rayon"] }
fontique = "0.11.1"
futures-channel = "0.3.34"
harfrust = "0.13.3"
hashbrown = "0.17.1"
hayro = "0.7.1"
hypher = "0.1.7"
icu_normalizer = { version = "2.3.0", default-features = false, features = ["compiled_data"] }
icu_properties = "2.3.0"
icu_segmenter = "2.3.0"
imageproc = "0.27.0"
imbl = "7.0.2"
indoc = "2.0.7"
jieba-rs = "0.11.0"
keyring = { version = "4.2.0", features = ["linux-keyutils-keyring-store"] }
keyring-core = "1.0.0"
