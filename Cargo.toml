# Shenron Rust workspace: the shenron CLI, MCP server, C ABI, studio commands,
# Pure GPUI desktop/web apps (gpui-kit 0.10.0 + gpui-fast) and the Koharu engine (crates/koharu-*).
# Koharu engine crates (ML runtime, torch, diffusion, llama) come from github.com/koharu-rs/koharu.
[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["crates/shenron-video", "crates/shenron-tv"]

[workspace.package]
version = "1.4.5"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
authors = ["Shenron contributors"]
homepage = "https://dragonballfr.com"
repository = "https://github.com/aphrody-labs/shenron"

[workspace.dependencies]
alphanumeric-sort = "1.5.8"
eventsource-stream = "0.2.3"
fast_image_resize = { version = "6.1.0", features = ["image", "rayon"] }
fontique = "0.11.1"
futures-channel = "0.3.34"
harfrust = "0.13.3"
hashbrown = "0.17.1"
hayro = "0.7.1"
hypher = "0.1.7"
icu_normalizer = { version = "2.3.0", default-features = false, features = ["compiled_data"] }
icu_properties = "2.3.0"
icu_segmenter = "2.3.0"
imageproc = "0.27.0"
imbl = "7.0.2"
indoc = "2.0.7"
jieba-rs = "0.11.0"
keyring = { version = "4.2.0", features = ["linux-keyutils-keyring-store"] }
keyring-core = "1.0.0"
linux-keyutils-keyring-store = "1.0.0"
postcard = { version = "1.1.3", features = ["use-std"] }
rars = "0.9.4"
rfd = "0.17.2"
revision = { version = "0.30.0", features = ["uuid"] }
secrecy = { version = "0.10.3", features = ["serde"] }
# koharu-library reads user CBZ/ZIP archives: zip >= 9.0.5 fixes GHSA-m665-v7pm-7grj (critical),
# GHSA-9hj8-73fh-9963, GHSA-hjqx-j4rw-g7xv, GHSA-q7v9-x93c-xqv3 and GHSA-8hxf-qr8p-62x4.
# zip >= 9 for koharu-library archive reads.
zip = { version = "9.3.0", features = ["deflate"] }
serde-wasm-bindgen = "0.6.5"
slotmap = "1.1.1"
smallvec = "1.16.0"
# shenron-ffi: serde-aware generation of the @aphrody/shenron-native payload types (pinned with specta).
specta-serde = "=0.0.13"
tokio-rayon = "2.1.0"
unicode-bidi = "0.3.18"
# The one wgpu of the workspace (crates/shenron-gpu owns it); vello 0.11 builds on wgpu 30, keep both in step.
vello = "0.11.0"
wgpu = "30.0.1"
# shenron-engine: math types and the WGSL front end of its shader tests (naga follows wgpu 30).
glam = { version = "0.30", features = ["bytemuck", "serde"] }
naga = { version = "30.0.1", features = ["wgsl-in"] }
# dragon-pixel (crates/dragon-pixel): the Bevy 3D view (feature `bevy`, wasm32 + WebGPU only) and
# the multiplayer room service (feature `server`).
bevy = { version = "0.19.1", default-features = false, features = ["3d", "web", "webgpu"] }
bevy_ecs = { version = "0.19.1", default-features = false }
futures-util = "0.3"
tokio-tungstenite = "0.30"
# shenron-api tests: drive the Axum router in process (`ServiceExt::oneshot`), the tower axum already pulls.
tower = { version = "0.5.3", default-features = false, features = ["util"] }
