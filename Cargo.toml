# Inherited by every crate through `[lints] workspace = true` (scripts/build/rust/align-crates.ts);
# CI denies warnings (`cargo lint`). Thresholds and test allowances live in clippy.toml.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"
explicit_outlives_requirements = "warn"
macro_use_extern_crate = "warn"
meta_variable_misuse = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# Restriction and pedantic lints the whole workspace already satisfies.
cloned_instead_of_copied = "warn"
empty_drop = "warn"
fn_to_numeric_cast_any = "warn"
get_unwrap = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
infinite_loop = "warn"
large_futures = "warn"
large_stack_arrays = "warn"
lossy_float_literal = "warn"
mem_forget = "warn"
redundant_type_annotations = "warn"
rest_pat_in_fully_bound_structs = "warn"
try_err = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
verbose_file_reads = "warn"

# Line tables keep file:line backtraces for workspace code; dependencies carry no debuginfo.
[profile.dev]
split-debuginfo = "unpacked"
incremental = true
codegen-units = 16
debug = "limited"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 16
strip = "debuginfo"

# Shipped artifacts: `cargo build --profile production` (output in target/production). Fat LTO
# over a single codegen unit trades a much longer link for smaller, faster binaries, and the
# symbol table is stripped. `release` stays the quick lane for iterations. panic stays "unwind":
# shenron-ffi contains panics at the FFI boundary with catch_unwind, so abort would kill the
# server process that loads it.
[profile.production]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"

# Standalone executables (shenron, shenron-mcp, shenron-video, koharu-sdk, service binaries):
# nothing catches panics there, so abort drops the unwinding tables. Never use it for
# shenron-ffi or other cdylibs loaded into a host process.
[profile.production-abort]
inherits = "production"
panic = "abort"

[profile.dev.build-override]
codegen-units = 16
split-debuginfo = "unpacked"
debug = "limited"
