# SPDX-License-Identifier: Apache-2.0
[package]
name = "shenron-re"
description = "Pure Rust reverse engineering engine and binary parsers for Dragon Ball Xenoverse 2 (DBXV2) formats, CRIWARE CPK archives, live memory inspection, and game data ingestion for Shenron."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
keywords = ["reverse-engineering", "dbxv2", "cpk", "crilayla", "shenron"]
categories = ["development-tools::debugging", "parser-implementations"]

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[features]
default = []
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
aes = "0.9.3"
hex = "0.4"
md5 = { package = "md-5", version = "0.11.0" }
memmap2 = { workspace = true }
wasm-bindgen = { workspace = true, optional = true }
serde-wasm-bindgen = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
wasm-bindgen = { workspace = true }
serde-wasm-bindgen = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
serde-wasm-bindgen = { workspace = true }

[[bin]]
name = "shenron-re"
path = "src/bin/shenron-re.rs"
