<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shenron Studio</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0a0a;
        --fg: #f4f1e8;
        --muted: #a39e93;
        --edge: #ef9a2b;
        --core: #fdffea;
        --star: #e81f23;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: radial-gradient(circle at 50% 40%, #1d1408, var(--bg) 70%);
        color: var(--fg);
        font:
          15px/1.5 system-ui,
          "Segoe UI",
          sans-serif;
        user-select: none;
      }
      main {
        height: 100%;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 20px;
        text-align: center;
      }
      img {
        width: 128px;
        height: 128px;
        filter: drop-shadow(0 6px 18px #f7a21e55);
      }
      h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: 0.04em;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
      .balls {
        display: flex;
        gap: 10px;
      }
      .balls span {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, var(--core), var(--edge) 75%);
        box-shadow: inset 0 0 0 1px #00000040;
        position: relative;
        animation: glow 1.4s ease-in-out infinite;
        opacity: 0.35;
      }
      .balls span::after {
        content: "★";
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 9px;
        color: var(--star);
      }
      .balls span:nth-child(2) {
        animation-delay: 0.2s;
      }
      .balls span:nth-child(3) {
        animation-delay: 0.4s;
      }
      .balls span:nth-child(4) {
        animation-delay: 0.6s;
      }
      .balls span:nth-child(5) {
        animation-delay: 0.8s;
      }
      .balls span:nth-child(6) {
        animation-delay: 1s;
      }
      .balls span:nth-child(7) {
        animation-delay: 1.2s;
      }
      @keyframes glow {
        50% {
          opacity: 1;
          transform: translateY(-4px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .balls span {
          animation: none;
          opacity: 1;
        }
      }
    </style>
  </head>
  <body data-tauri-drag-region>
    <main data-tauri-drag-region>
      <img src="logo.png" alt="" data-tauri-drag-region />
      <h1>Shenron Studio</h1>
      <p id="status">Démarrage du serveur local…</p>
      <div class="balls" role="progressbar" id="loader" aria-label="Démarrage">
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
    </main>
    <script>
      // The splash ships before the site and its dictionaries: its two strings follow the system language.
      const strings = {
        fr: ["Démarrage du serveur local…", "Démarrage"],
        en: ["Starting the local server…", "Starting"],
        ja: ["ローカルサーバーを起動しています…", "起動中"],
      };
      const lang = (navigator.language || "fr").slice(0, 2);
      const [status, label] = strings[lang] || strings.fr;
      document.documentElement.lang = strings[lang] ? lang : "fr";
      document.getElementById("status").textContent = status;
      document.getElementById("loader").setAttribute("aria-label", label);
    </script>
  </body>
</html>
