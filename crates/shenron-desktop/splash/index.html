<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shenron</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: dark light;
        --bg: #0a0a0a;
        --fg: #f4f1e8;
        --muted: #a39e93;
        --accent: #f7c81e;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f7f4ec;
          --fg: #14120e;
          --muted: #5d584e;
          --accent: #c7470f;
        }
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.5 system-ui, "Segoe UI", sans-serif;
      }
      main {
        height: 100%;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 18px;
        text-align: center;
      }
      img {
        width: 132px;
        height: 132px;
      }
      h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: 0.02em;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
      .barre {
        width: 220px;
        height: 4px;
        overflow: hidden;
        background: color-mix(in srgb, var(--fg) 12%, transparent);
      }
      .barre::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        background: var(--accent);
        animation: va-et-vient 1.1s ease-in-out infinite alternate;
      }
      @keyframes va-et-vient {
        from {
          transform: translateX(-10%);
        }
        to {
          transform: translateX(160%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .barre::after {
          animation: none;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="icon.svg" alt="" />
      <h1>Shenron</h1>
      <p>Démarrage du serveur local…</p>
      <div class="barre" role="progressbar" aria-label="Démarrage"></div>
    </main>
  </body>
</html>
