# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "koharu-web"
description = "Koharu as a headless HTTP service: upload a manga page, get OCR, translation and a typeset PNG (own subdomain, pure Rust)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
authors = ["Mayo Takanashi <mayo@linux.com>", "Wangchong Zhou <fffonion@gmail.com>"]
homepage = "https://koharu.rs"
repository = "https://github.com/koharu-rs/koharu"
publish = false

[[bin]]
name = "koharu-web"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
futures-util = { workspace = true }
koharu-library = { workspace = true }
koharu-pipeline = { workspace = true }
koharu-translator = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
