[package]
name = "shenron-api"
description = "The Shenron HTTP contract (packages/api/openapi/public.json) served by Axum: the Rust side of the TypeScript to Rust migration, route group by route group."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[lib]
name = "shenron_api"

[[bin]]
name = "shenron-api"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
shenron-lexicon = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tower = { workspace = true }
