# SPDX-License-Identifier: Apache-2.0
[package]
name = "shenron-engine"
description = "Unified production-grade full-Rust game engine, GPU backend, 2D/3D renderer, vector canvas, and WASM bindings."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[features]
wasm = [
  "dep:wasm-bindgen",
  "dep:wasm-bindgen-futures",
  "dep:serde-wasm-bindgen",
  "dep:js-sys",
  "dep:web-sys",
]

[dependencies]
# Math, memory and core
glam = { workspace = true }
bytemuck = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
rayon = { workspace = true }
sha2 = { workspace = true }
shenron-panels = { workspace = true }
shenron-re = { workspace = true }
dragon-pixel = { workspace = true }

# GPU & Graphics
wgpu = { workspace = true }

image = { workspace = true }

# WASM optional/conditional
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
serde-wasm-bindgen = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = [
  "Window",
  "Document",
  "HtmlCanvasElement",
  "CanvasRenderingContext2d",
  "GpuAdapter",
  "GpuDevice",
  "GpuQueue",
  "GpuCanvasContext",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
memmap2 = { workspace = true }
pollster = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
serde-wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
  "Window",
  "Document",
  "HtmlCanvasElement",
  "CanvasRenderingContext2d",
  "GpuAdapter",
  "GpuDevice",
  "GpuQueue",
  "GpuCanvasContext",
] }

[dev-dependencies]
naga = { workspace = true }
pollster = { workspace = true }
serde_json = { workspace = true }
