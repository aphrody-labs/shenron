[package]
name = "koharu-canvas"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Manga translation tools"
license = "MIT OR Apache-2.0"
authors = ["Mayo Takanashi <mayo@linux.com>", "Wangchong Zhou <fffonion@gmail.com>"]
readme = "README.md"
homepage = "https://dragonballfr.com"
repository = "https://github.com/aphrody-labs/shenron"
keywords = ["manga", "ocr", "translation", "deep_learning", "computer_vision"]
publish = true
include = ["src/**", "tests/**", "benches/**", "Cargo.toml", "LICENSE", "README.md"]

[package.metadata.shenron.provenance]
upstream-repository = "https://github.com/koharu-rs/koharu"
upstream-license = "MIT OR Apache-2.0"

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-channel = { workspace = true }
js-sys = { workspace = true }
# The viewport prepares nothing: skip the rasterizer `native` feature (image, rayon, pollster).
koharu-rasterizer = { workspace = true, default-features = false }
serde = { workspace = true }
serde-wasm-bindgen = { workspace = true }
vello = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = [
  "Blob",
  "BlobPropertyBag",
  "ColorSpaceConversion",
  "HtmlCanvasElement",
  "ImageBitmap",
  "ImageBitmapOptions",
  "ImageOrientation",
  "PremultiplyAlpha",
  "Window",
] }

[dev-dependencies]
koharu-rasterizer = { workspace = true }
