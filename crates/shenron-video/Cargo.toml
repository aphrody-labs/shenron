# SPDX-License-Identifier: Apache-2.0
# Standalone workspace (excluded from the root one): the FilmCraft codecs live on the Bun OS `os`
# branch, not yet on aphrody-labs/bun, so the root workspace must not resolve them. Once the pinned
# revision is public, drop the `[workspace]` table and the root `exclude`, and inherit workspace fields.
[workspace]

[package]
name = "shenron-video"
description = "Shenron video library, pure Rust, no ffmpeg: MPEG-1/2 decode, H.264 encode, fragmented MP4 mux, probe, stills."
version = "1.4.5"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
authors = ["aphrody-dev <contact@aphrody.com>"]
homepage = "https://dragonballfr.com"
repository = "https://github.com/aphrody-labs/shenron"
publish = false

[lib]
name = "shenron_video"
path = "src/lib.rs"

[[bin]]
name = "shenron-video"
path = "src/main.rs"

[dependencies]
filmcraft-mpeg2v = { git = "https://github.com/aphrody-labs/bun", rev = "f067d7f77e4b5a95412bc35e8bcee5f809670ecc" }
filmcraft-h264enc = { git = "https://github.com/aphrody-labs/bun", rev = "f067d7f77e4b5a95412bc35e8bcee5f809670ecc" }
filmcraft-isobmff = { git = "https://github.com/aphrody-labs/bun", rev = "f067d7f77e4b5a95412bc35e8bcee5f809670ecc" }

[lints.rust]
unsafe_code = "forbid"
