# SPDX-License-Identifier: Apache-2.0
[package]
name = "shenron-admin-ui"
description = "The admin. dashboard in Rust (Dioxus): one codebase for the desktop app (feature desktop) and the web build (feature web)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "shenron-admin-app"
path = "src/main.rs"

[features]
default = []
desktop = ["dioxus/desktop"]
web = ["dioxus/web"]

[lints.rust]
unsafe_code = "forbid"

[dependencies]
dioxus = { version = "0.7.10" }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true }
rustls = { workspace = true }
