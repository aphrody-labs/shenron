# SPDX-License-Identifier: Apache-2.0
[package]
name = "shenron-ffi"
description = "C ABI of Shenron (shenron_*): the shenron command, RAG chunking and search, persona, the local corpus and cancellable jobs for bun:ffi and C hosts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true

[lib]
name = "shenron_ffi"
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
axum = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
shenron-cli = { workspace = true }
shenron-home = { workspace = true }
shenron-memory = { workspace = true }
shenron-rag-core = { workspace = true }
shenron-re = { workspace = true }
shenron-rag = { workspace = true }
specta = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }

[target.'cfg(all(not(target_arch = "wasm32"), unix))'.dependencies]
rustix = { version = "1.1.5", default-features = false, features = ["stdio"] }

[target.'cfg(all(not(target_arch = "wasm32"), windows))'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
specta-serde = { workspace = true }
specta-typescript = { workspace = true }
