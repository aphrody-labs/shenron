[package]
name = "shenron-ffi"
description = "C ABI of Shenron (shenron_*): the shenron command, RAG chunking and search, persona, the local corpus and cancellable jobs for bun:ffi and C hosts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true

[lib]
name = "shenron_ffi"
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
aphrody-agent-home = { workspace = true }
aphrody-llama-server = { workspace = true }
aphrody-models = { workspace = true }
aphrody-memory = { workspace = true }
aphrody-rag-core = { workspace = true }
aphrody-backend = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
shenron-cli = { workspace = true }
shenron-rag = { workspace = true }
specta = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
specta-serde = { workspace = true }
specta-typescript = { workspace = true }
tempfile = { workspace = true }
