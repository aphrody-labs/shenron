[package]
name = "shenron-jev"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Jev System One decision protocol, validation and optional endpoint clients"
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
client = ["dep:futures", "dep:reqwest", "dep:rustls", "dep:tokio", "dep:tracing", "dep:url"]
server = ["client", "dep:axum", "tokio/rt-multi-thread", "tokio/macros", "tokio/net"]

[dependencies]
axum = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
url = { workspace = true, optional = true }

[dev-dependencies]
axum = { workspace = true }
tokio = { workspace = true }

[[test]]
name = "native"
required-features = ["client"]

[[test]]
name = "rag"
required-features = ["client"]

[[test]]
name = "router"
required-features = ["client"]

[[test]]
name = "server"
required-features = ["server"]
