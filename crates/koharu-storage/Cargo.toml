[package]
name = "koharu-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Filesystem-native snapshot and blob storage for Koharu."
license = "MIT OR Apache-2.0"
authors = ["Mayo Takanashi <mayo@linux.com>", "Wangchong Zhou <fffonion@gmail.com>"]
readme = "README.md"
homepage = "https://dragonballfr.com"
repository = "https://github.com/aphrody-labs/shenron"
keywords = ["manga", "ocr", "translation", "deep_learning", "computer_vision"]
publish = true
include = ["src/**", "tests/**", "benches/**", "Cargo.toml", "LICENSE", "README.md"]

[package.metadata.shenron.provenance]
upstream-repository = "https://github.com/koharu-rs/koharu"
upstream-license = "MIT OR Apache-2.0"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
blake3 = { workspace = true }
bytes = { workspace = true }
fs4 = { workspace = true }
memmap2 = { workspace = true }
parking_lot = { workspace = true }
revision = { workspace = true }
serde = { workspace = true }
specta = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "storage"
harness = false
