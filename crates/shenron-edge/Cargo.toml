# SPDX-License-Identifier: Apache-2.0
[package]
name = "shenron-edge"
description = "Pingora reverse proxy and load balancer (rustls, ACME, disk cache) that replaces nginx on the Shenron fleet."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true

[lib]
name = "shenron_edge"

[[bin]]
name = "shenron-edge"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
arc-swap = { workspace = true }
async-trait = { workspace = true }
blake3 = { workspace = true }
bytes = { workspace = true }
http = "1"
httpdate = "1.0.3"
instant-acme = { version = "0.8.5", default-features = false, features = ["ring", "hyper-rustls", "rcgen", "x509-parser"] }
ipnet = "2.12.2"
pingora = { version = "0.9.1", default-features = false, features = ["proxy", "rustls"] }
postcard = { workspace = true }
regex = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = "2.2.0"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
x509-parser = "0.18.1"

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["pem", "ring"] }
tempfile = { workspace = true }
