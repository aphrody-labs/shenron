<!doctype html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Shenron TV : anime, films et vid&eacute;os en streaming HLS adaptatif.">
<title>Shenron TV</title>
<style>
:root{color-scheme:dark;--bg:#0b0d12;--card:#151922;--fg:#e8ecf4;--mut:#a3acbf;--acc:#ff8a1f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:1rem/1.5 system-ui,sans-serif}
.skip{position:absolute;left:-999px;top:0;background:var(--acc);color:#000;padding:8px 12px;z-index:9}.skip:focus{left:8px;top:8px}
header{padding:16px 24px;border-bottom:1px solid #222836;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
header h1{margin:0;font-size:1.25rem}header p{margin:0;color:var(--mut)}
main{display:grid;grid-template-columns:minmax(0,2fr) minmax(260px,1fr);gap:24px;padding:24px;max-width:1400px;margin:auto}
@media(max-width:860px){main{grid-template-columns:1fr;padding:16px}}
video{display:block;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px}
h2{margin:12px 0 4px;font-size:1.25rem}#meta{color:var(--mut);font-size:.875rem;min-height:1.3em}
ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
li a{display:grid;grid-template-columns:120px 1fr;gap:12px;text-decoration:none;color:inherit;background:var(--card);border-radius:10px;padding:8px}
li img{width:120px;height:67px;object-fit:cover;border-radius:6px;background:#000}
li b{display:block;font-weight:600}li small{color:var(--mut)}li a[aria-current=true]{outline:2px solid var(--acc)}
a:focus-visible,video:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<a class="skip" href="#player">Aller au lecteur</a>
<header><h1>Shenron TV</h1><p>Anime, films et vid&eacute;os</p></header>
<main>
<section id="player" aria-labelledby="title">
<video id="v" controls playsinline preload="metadata" aria-label="Lecteur vid&eacute;o"></video>
<h2 id="title">Aucune vid&eacute;o</h2><p id="meta" aria-live="polite"></p>
</section>
<nav aria-label="Biblioth&egrave;que"><ul id="list"></ul></nav>
</main>
<noscript><p style="padding:24px">JavaScript est n&eacute;cessaire pour lire les vid&eacute;os.</p></noscript>
<script src="/assets/hls.min.js" defer></script>
<script defer>
addEventListener('DOMContentLoaded',()=>{
const v=document.getElementById('v'),list=document.getElementById('list');let hls;
const fmt=s=>s?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'';
function play(x){
  document.getElementById('title').textContent=x.title;
  document.getElementById('meta').textContent=[fmt(x.duration_secs),x.renditions.map(h=>h+'p').join(' / ')].filter(Boolean).join(' - ');
  v.poster=x.poster;history.replaceState(null,'','?v='+x.id);
  document.querySelectorAll('li a').forEach(a=>a.dataset.id===x.id?a.setAttribute('aria-current','true'):a.removeAttribute('aria-current'));
  if(hls){hls.destroy();hls=null}
  if(v.canPlayType('application/vnd.apple.mpegurl')){v.src=x.playlist}
  else if(window.Hls&&Hls.isSupported()){hls=new Hls();hls.loadSource(x.playlist);hls.attachMedia(v)}
}
fetch('/api/v1/videos').then(r=>r.json()).then(({videos})=>{
  const ready=videos.filter(x=>x.status==='ready');
  for(const x of ready){
    const li=document.createElement('li'),a=document.createElement('a'),img=new Image(120,67),s=document.createElement('span'),b=document.createElement('b'),sm=document.createElement('small');
    a.href='?v='+x.id;a.dataset.id=x.id;img.alt='';img.src=x.poster;img.loading='lazy';
    b.textContent=x.title;sm.textContent=fmt(x.duration_secs);s.append(b,sm);a.append(img,s);li.append(a);
    a.onclick=e=>{e.preventDefault();play(x)};list.append(li);
  }
  const want=new URLSearchParams(location.search).get('v');
  const first=ready.find(x=>x.id===want)||ready[0];
  if(first)play(first);
});
});
</script>
</body>
</html>
