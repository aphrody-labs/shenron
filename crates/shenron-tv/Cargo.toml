# SPDX-License-Identifier: Apache-2.0
# Standalone crate (own Cargo.lock, excluded from the workspace): builds in seconds, and the
# HTTP API (docs/decisions/0006-tv-video-service.md) is reusable by sibling products.
[package]
name = "shenron-tv"
description = "tv.: video library, yt-dlp ingest, FFmpeg HLS ladder and web player over a stable HTTP API."
version = "1.4.5"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false

[[bin]]
name = "shenron-tv"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", default-features = false, features = ["json", "tokio", "http1", "http2"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "signal", "sync", "time", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v7"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[lints.clippy]
correctness = { level = "deny", priority = -1 }
todo = "deny"
dbg_macro = "deny"
