# SPDX-License-Identifier: Apache-2.0
# Standalone crate (own Cargo.lock, excluded from the workspace like shenron-tv): the deploy agent must build
# in seconds on the builder and never depend on the resolution of the whole monorepo (koharu git deps).
[package]
name = "shenron-deployd"
description = "Deploy without SSH or git: signed release manifests (ed25519), artifact store publisher and per-host agent with atomic symlink swap, health-gated rollback and an mTLS status API (ADR 0009)."
version = "1.4.5"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
homepage = "https://dragonballfr.com"
repository = "https://github.com/aphrody-labs/shenron"
publish = false

[lib]
name = "shenron_deployd"
path = "src/lib.rs"

[[bin]]
name = "shenron-deployd"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "json", "query", "tokio"] }
axum-server = { version = "0.9.2", default-features = false, features = ["tls-rustls-no-provider"] }
base64 = "0.23.1"
clap = { version = "4.6.8", features = ["derive", "env"] }
ed25519-dalek = "3.0.0"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
futures-util = "0.3.34"
getrandom = "0.4"
hex = "0.4.3"
hmac = "0.13"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream", "http2"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1.16.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = { version = "0.4", default-features = false }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "process", "signal", "sync", "time", "io-util", "net"] }
tokio-util = { version = "0.7.20", features = ["io"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
zbus = { version = "6.3.0", default-features = false, features = ["proxy", "tokio", "tokio-multithread"] }

[dev-dependencies]
rcgen = "0.14.10"
tempfile = "3.27.0"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
todo = "deny"
dbg_macro = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
