# No [pet]: neither the shenron plugin nor toriyama-svg provides an animated character with
# per-state files (pets/<provider>/<id>/<state>.webp|json). See README.md.

[typography]
# apps/site/src/app/fonts.css: --font-sans, --font-mono-src (both OFL, served by the CDN).
display = "Google Sans Flex"
body = "Google Sans Flex"
mono = "JetBrains Mono"

[shell]
# 56 px top header (tokens.json layout.header-height) with backdrop-filter: blur(12px)
# (dragon-ball-design.css). Radii: tokens sm 6, live --radius / --site-panel-radius 8, tokens lg 16.
# Motion 200 ms base (tokens.json motion.base) = the calm profile duration.
layout = "top-bar"
density = 0
radius = [6, 8, 16]
glass_blur = 12
motion = "calm"
