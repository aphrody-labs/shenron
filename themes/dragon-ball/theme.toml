# Dragon Ball pack for dragonballfr.com (Shenron), Yolo UI theme pack schema v1.
# Every value is measured from Shenron's design system or the live site; sources per field are in
# README.md. Wallpapers stay on cdn.dragonballfr.com and are referenced by URL, hash and focal point:
# no Toei or manga image is stored in this repository.
id = "dragon-ball"
name = "Dragon Ball"

[title]
# Live <title> template ("%s — DBFR"), application-name and the home <h1> (2026-11-05).
product_name = "DBFR"
window_title_template = "{page} — DBFR"
ntp_heading = "Dragon Ball, en français et sourcé"

[logo]
# Kinto-Un, generated by the toriyama-svg geometry (kinto-un icone); byte-identical to
# packages/ui/assets/dbz/kinto-un-icone.svg, the site's favicon source. Rasters and .ico already
# exist in packages/ui/assets and are not duplicated here (no binaries in the pack).
mark = "assets/logo/kinto-un-mark.svg"
monochrome = "assets/logo/kinto-un-monochrome.svg"

[color]
# Accent --dbz-orange #e78220 (replica/design/tokens.json "accent"). Fidelity keeps the generated
# containers close to the seed's chroma; the overrides pin the roles to the site's measured tokens.
seed = "#e78220"
source = "seed"
variant = "fidelity"
contrast = 0.0
mode = "dark"

[color.overrides]
primary = "#e78220"               # accent, --color-dbz-orange
on-primary = "#0a0a0a"            # on-accent; 7.18:1
background = "#0a0a0a"            # bg, --color-dbz-bg
on-background = "#efe9d8"         # text, --color-os; 16.33:1
surface = "#0a0a0a"               # bg, --color-dbz-bg
on-surface = "#efe9d8"            # text, --color-os; 16.33:1
surface-container-low = "#141410" # surface, --color-dbz-card (the live --dbz-card mapping); 15.23:1 with on-surface
surface-variant = "#2a2a26"       # border tone; 5.71:1 with on-surface-variant
on-surface-variant = "#a8a393"    # text-muted; 7.85:1 on bg, 7.32:1 on card
outline = "#8a8a7e"               # border-input; 5.67:1 on bg (UI component, >= 3:1)
outline-variant = "#2a2a26"       # border hairline, --color-dbz-border (decorative)
tertiary = "#fefd03"              # focus-ring, --color-dbz-yellow; 18.16:1 on bg
on-tertiary = "#0a0a0a"           # 18.16:1

[icons]
# The site imports lucide-react in 121 places (2 px stroke outlines).
set = "lucide"
style = "outlined"
weight = 400

