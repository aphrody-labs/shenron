# Dragon Ball pack for dragonballfr.com (Shenron), Yolo UI theme pack schema v1.1.
# Rights: the product owner decided on 2026-11-05 (in the work chat), after settling with the rights
# holders, that Shenron may serve the real Dragon Ball assets. Licence of every asset below is
# LicenseRef-DBFR-Rights-Holder-Authorized-2026-11-05: that decision, not a published licence text.
# THESE ASSETS ARE NOT REDISTRIBUTABLE OUTSIDE SHENRON (dragonballfr.com and its CDN). Do not
# publish this pack, mirror its files or ship it in another product. Sources and sha256: PROVENANCE.md.
# Wallpapers and sounds stay on cdn.dragonballfr.com and are referenced by URL and sha256.
id = "dragon-ball"
name = "Dragon Ball"

[title]
# Live <title> template ("%s — DBFR"), application-name and the home <h1> (2026-11-05).
product_name = "DBFR"
window_title_template = "{page} — DBFR"
ntp_heading = "Dragon Ball, en français et sourcé"

[logo]
# Kinto-Un, generated by the toriyama-svg geometry (kinto-un icone); byte-identical to
# packages/ui/assets/dbz/kinto-un-icone.svg, the site's favicon source. Rasters and .ico already
# exist in packages/ui/assets and are not duplicated here (no binaries in the pack).
mark = "assets/logo/kinto-un-mark.svg"
wordmark = "assets/brand/dragonballfr-wordmark.svg"
monochrome = "assets/logo/kinto-un-monochrome.svg"

[color]
# Seed = the real focus-ring colour of the live site, read from computed styles on 2026-11-05
# (`focus-visible:outline-kinto-lumiere`, --color-kinto-lumiere = rgb(252, 240, 58)). All 50 roles,
# focus-ring included, are computed (HCT, vibrant) in both schemes: no role is pinned.
seed = "#fcf03a"
source = "seed"
variant = "vibrant"
contrast = 0.0
mode = "system"

[icons]
# The site imports lucide-react in 121 places (2 px stroke outlines).
set = "lucide"
style = "outlined"
weight = 400

# Toei episode stills used by the live home hero (apps/site/src/lib/home-hero-frames.ts), in its
