# Companion: Shenron, the site's own vector illustration (static, one file for every state: the
# shell animates it). Dragon Radar and Nuage Magique have no pet asset in the repository or on the
# CDN; the Nuage Magique mark is the logo.
[pet]
id = "shenron"
provider = "pack"
anchor = "bottom-right"
name = "Shenron"
states = ["idle", "active", "sleep"]
size = 160

[pet.files]
idle = "assets/pet/shenron.svg"
active = "assets/pet/shenron.svg"
sleep = "assets/pet/shenron.svg"

[typography]
# apps/site/src/app/fonts.css: --font-sans, --font-mono-src (both OFL, served by the CDN).
display = "Google Sans Flex"
body = "Google Sans Flex"
mono = "JetBrains Mono"

[shell]
# 56 px top header (tokens.json layout.header-height) with backdrop-filter: blur(12px)
# (dragon-ball-design.css). Radii: tokens sm 6, live --radius / --site-panel-radius 8, tokens lg 16.
# Motion 200 ms base (tokens.json motion.base) = the calm profile duration.
layout = "top-bar"
density = 0
radius = [6, 8, 16]
glass_blur = 12
motion = "calm"

