# SPDX-License-Identifier: Apache-2.0
# Ledger of the TypeScript to Rust migration of Shenron (docs/decisions/0004-migration-typescript-rust.md).
#
#   cargo run -p shenron-migrate -- status [--json]   per unit: TypeScript lines left, state, target crate
#   cargo run -p shenron-migrate -- check             the gate (just migrate-check, in just ci)
#   cargo run -p shenron-migrate -- ratchet           lower ts_lines to what is left (never raises them)
#
# Every TypeScript file of the repository belongs to one unit (longest path wins). state:
#   ts    TypeScript only, Rust target planned
#   dual  both live; parity paths hold the golden cases both implementations replay
#   rust  TypeScript deleted (0 lines), the Rust crate is the implementation
# ts_lines is a ratchet: the TypeScript of a unit may shrink, never grow.

[ledger]
exclude = ["node_modules", "target", ".next", "dist", ".git", "third_party", ".turbo", ".cache"]

[[unit]]
name = "site"
ts = ["apps/site"]
rust = "crates/shenron-site"
state = "ts"
ts_lines = 276497
note = "Next.js 16 -> Leptos 0.8 SSR + islands on Axum (ADR 0001). Self-hosted on prd (health/ready handler split, RSS fallback, Turbopack isolation)"

