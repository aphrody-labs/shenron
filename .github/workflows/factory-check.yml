# SPDX-License-Identifier: Apache-2.0
name: VPS factory qualification

# Private, trusted manual qualification only. Pull requests never run on this host.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shenron-vps-factory-qualification
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: [self-hosted, Linux, X64, shenron-factory, vps]
    timeout-minutes: 10
    steps:
      - name: Verify non-root factory identity and runtime tools
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = shenron-build
          test "$(id -u)" != 0
          bun --version
          cargo --version
          rustc --version
          docker version --format '{{.Server.Version}}'
          docker buildx version
          docker compose version
          test -d /home/shenron-build/runner
          df -h /home/shenron-build

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify the Aphrody build image and its toolchain
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/build/container.ts --check
          bun scripts/build/container.ts --no-lock -- sh -c \
            'id -u; rustc --version; cargo --version; bun --version; sccache --version; cargo-xwin --version; wasm-bindgen --version'
