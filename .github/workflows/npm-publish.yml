# Publication npm sans jeton (trusted publisher): le trusted publisher npm de chaque paquet pointe sur ce fichier.
name: npm-publish

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Dossiers des paquets, relatifs au dépôt, séparés par des espaces"
        required: true
      dry_run:
        description: "npm publish --dry-run"
        type: boolean
        default: true
      tag:
        description: "dist-tag"
        default: latest

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Publish
        env:
          PACKAGES: ${{ inputs.packages }}
          DRY_RUN: ${{ inputs.dry_run }}
          TAG: ${{ inputs.tag }}
        run: |
          for dir in $PACKAGES; do
            (cd "$dir" && npm publish --provenance --access public --tag "$TAG" $([ "$DRY_RUN" = true ] && echo --dry-run))
          done
