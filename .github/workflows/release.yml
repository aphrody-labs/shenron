name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag à releaser (ex. v0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Compile (${{ matrix.target }})
    # Bun compile en croisé : les deux cibles se construisent sur Linux.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, ext: "" }
          - { target: windows-x64, ext: ".exe" }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: ./.github/actions/setup-bun
      - name: Cache ~/.bun
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install
        run: bun ci

      - name: Verify the one release version
        run: bun scripts/release/check-version.ts "${{ github.event.inputs.tag || github.ref_name }}"

      # Le WASM de crates/koharu-canvas est suivi par Git (packages/koharu/src/wasm/, contrôlé
      # par rust.yml) : aucun outillage Rust pour le site.
      # Application frontale (Next standalone, sans base) + API locales, un seul fichier.
      - name: shenron-server
        run: bun scripts/build/server.ts --target ${{ matrix.target }} --flavor desktop

      # Bot Discord + API publique ; les migrations SQL voyagent à côté du binaire.
      - name: shenron-bot
        run: bun scripts/build/bot.ts --target ${{ matrix.target }}

      - name: Smoke test (bot, sans Discord ni base)
        if: matrix.target == 'linux-x64'
        run: dist/bot/linux-x64/shenron-bot --smoke

      - name: Package
        run: |
          mkdir -p release
          cp "dist/server/${{ matrix.target }}/shenron-server${{ matrix.ext }}" "release/shenron-server-${{ matrix.target }}${{ matrix.ext }}"
          if [ "${{ matrix.target }}" = "windows-x64" ]; then
            (cd dist/bot/windows-x64 && zip -qr "$GITHUB_WORKSPACE/release/shenron-bot-windows-x64.zip" .)
          else
            tar -C dist/bot/linux-x64 -czf release/shenron-bot-linux-x64.tar.gz .
          fi

      - name: Upload binaries
        uses: actions/upload-artifact@v5
        with:
          name: shenron-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

  desktop:
    name: Shenron Studio (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, os: ubuntu-22.04 }
          - { target: windows-x64, os: windows-latest }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
      - name: Check Aphrody access
        shell: bash
        env:
          APHRODY_GIT_TOKEN: ${{ secrets.APHRODY_GIT_TOKEN }}
        run: |
          if [ -z "$APHRODY_GIT_TOKEN" ]; then
            echo "::error::APHRODY_GIT_TOKEN is required (private Aphrody git dependencies)"
            exit 1
          fi
          git config --global url."https://x-access-token:${APHRODY_GIT_TOKEN}@github.com/aphrody-labs/".insteadOf \
            "https://github.com/aphrody-labs/"
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev build-essential file
      - name: Rust toolchain
        shell: bash
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-desktop-${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli
      - uses: ./.github/actions/setup-bun
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: release-desktop-bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install exact dependencies
        run: bun ci
      - name: Verify the one release version
        run: bun scripts/release/check-version.ts "${{ github.event.inputs.tag || github.ref_name }}"
      - name: Build Shenron Studio
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          bun scripts/build/desktop.ts --target "${{ matrix.target }}" --skip-chat-model
      - uses: actions/upload-artifact@v5
        with:
          name: shenron-studio-${{ matrix.target }}
          path: dist/desktop/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create GitHub Release (draft)
    needs: [build, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # One checksum index covers every server, bot and Studio asset in this release.
      - name: Generate SHA256 sums
        run: |
          cd artifacts
          rm -f SHA256SUMS
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Extract changelog
        id: changelog
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          {
            echo "changelog<<__EOF__"
            echo "## Commits depuis la release précédente"
            PREV=$(git tag --sort=-creatordate | grep -v "^$TAG$" | head -1 || echo "")
            if [ -n "$PREV" ]; then
              git log --pretty=format:"- %s (%h)" "$PREV..$TAG"
            else
              git log --pretty=format:"- %s (%h)" "$TAG"
            fi
            echo ""
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      # Keep a single reviewable draft until the owner publishes this complete release.
      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.changelog.outputs.tag }}
          name: Shenron ${{ steps.changelog.outputs.tag }}
          body: |
            ${{ steps.changelog.outputs.changelog }}

            ## Binaires autonomes

            | Binaire | Linux x64 | Windows x64 |
            |---|---|---|
            | `shenron-server` : application frontale + API locales | `shenron-server-linux-x64` | `shenron-server-windows-x64.exe` |
            | `shenron-bot` : bot Discord + API publique (migrations incluses) | `shenron-bot-linux-x64.tar.gz` | `shenron-bot-windows-x64.zip` |

            `shenron-server doctor` affiche le profil et la présence des secrets ; `shenron-bot --smoke`
            vérifie le binaire sans Discord ni base. Intégrité : `SHA256SUMS`.

            ## Shenron Studio

            Installers and sidecars for Linux x64 and Windows x64 are built from this exact tag
            and attached to this same release. `SHA256SUMS` covers the complete release.

            ## Depuis les sources

            ```bash
            git clone https://github.com/aphrody-labs/shenron.git
            cd shenron && bun install --frozen-lockfile
            cp apps/bot/.env.example apps/bot/.env   # DISCORD_TOKEN / GUILD_ID / OWNER_ID
            bun --filter @aphrody/shenron-bot dev
            ```
          files: artifacts/*
          draft: true
          prerelease: ${{ contains(steps.changelog.outputs.tag, '-') }}
