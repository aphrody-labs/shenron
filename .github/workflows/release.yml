name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag à releaser (ex. v0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Compile (${{ matrix.target }})
    # Bun compile en croisé : les deux cibles se construisent sur Linux.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, ext: "" }
          - { target: windows-x64, ext: ".exe" }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
      - name: Cache ~/.bun
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install
        run: bun ci

      # Le site importe la sortie wasm-pack de crates/koharu-canvas (générée, ignorée par Git).
      - name: Koharu canvas toolchain (wasm32 + wasm-pack)
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --locked

      # Application frontale (Next standalone, sans base) + API locales, un seul fichier.
      - name: shenron-server
        run: bun scripts/build/server.ts --target ${{ matrix.target }} --flavor desktop

      # Bot Discord + API publique ; les migrations SQL voyagent à côté du binaire.
      - name: shenron-bot
        run: bun scripts/build/bot.ts --target ${{ matrix.target }}

      - name: Smoke test (bot, sans Discord ni base)
        if: matrix.target == 'linux-x64'
        run: dist/bot/linux-x64/shenron-bot --smoke

      - name: Package
        run: |
          mkdir -p release
          cp "dist/server/${{ matrix.target }}/shenron-server${{ matrix.ext }}" "release/shenron-server-${{ matrix.target }}${{ matrix.ext }}"
          if [ "${{ matrix.target }}" = "windows-x64" ]; then
            (cd dist/bot/windows-x64 && zip -qr "$GITHUB_WORKSPACE/release/shenron-bot-windows-x64.zip" .)
          else
            tar -C dist/bot/linux-x64 -czf release/shenron-bot-linux-x64.tar.gz .
          fi

      - name: Upload binaries
        uses: actions/upload-artifact@v5
        with:
          name: shenron-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create GitHub Release (draft)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # Nom attendu par install.ps1 : SHA256SUMS.
      - name: Generate SHA256 sums
        run: |
          cd artifacts
          sha256sum shenron-* > SHA256SUMS
          cat SHA256SUMS

      - name: Extract changelog
        id: changelog
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          {
            echo "changelog<<__EOF__"
            echo "## Commits depuis la release précédente"
            PREV=$(git tag --sort=-creatordate | grep -v "^$TAG$" | head -1 || echo "")
            if [ -n "$PREV" ]; then
              git log --pretty=format:"- %s (%h)" "$PREV..$TAG"
            else
              git log --pretty=format:"- %s (%h)" "$TAG"
            fi
            echo ""
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      # Brouillon : install.ps1 lit releases/latest et exige l'installeur Windows, construit
      # hors CI (Rust, Tauri, NSIS). La release n'est publiée qu'une fois l'installeur joint.
      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.changelog.outputs.tag }}
          name: Shenron ${{ steps.changelog.outputs.tag }}
          body: |
            ${{ steps.changelog.outputs.changelog }}

            ## Binaires autonomes

            | Binaire | Linux x64 | Windows x64 |
            |---|---|---|
            | `shenron-server` : application frontale + API locales | `shenron-server-linux-x64` | `shenron-server-windows-x64.exe` |
            | `shenron-bot` : bot Discord + API publique (migrations incluses) | `shenron-bot-linux-x64.tar.gz` | `shenron-bot-windows-x64.zip` |

            `shenron-server doctor` affiche le profil et la présence des secrets ; `shenron-bot --smoke`
            vérifie le binaire sans Discord ni base. Intégrité : `SHA256SUMS`.

            ## Application de bureau (Windows)

            Installeur `*_x64-setup.exe` (Tauri) installé par `install.ps1`. Construit hors CI :
            `bun scripts/build/desktop.ts --target windows-x64`, puis joindre
            `dist/desktop/windows-x64/*_x64-setup.exe` et ajouter sa ligne de
            `dist/desktop/windows-x64/SHA256SUMS` au `SHA256SUMS` de cette release avant publication.

            ## Depuis les sources

            ```bash
            git clone https://github.com/aphrody-labs/shenron.git
            cd shenron && bun install --frozen-lockfile
            cp apps/bot/.env.example apps/bot/.env   # DISCORD_TOKEN / GUILD_ID / OWNER_ID
            bun --filter @shenron/bot dev
            ```
          files: |
            artifacts/shenron-*
            artifacts/SHA256SUMS
          draft: true
          prerelease: ${{ contains(steps.changelog.outputs.tag, '-') }}
