name: Production image build and auto-deploy

# Build, verify and automatically ship the Shenron container image of main commits on the
# trusted self-hosted runner through scripts/deploy/release.sh (build-image.sh + ship-image.sh).
# Never schedule pull-request code on this host.

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "var/**"
      - ".coord/**"
  workflow_dispatch:
    inputs:
      vfs:
        description: Public VFS (local path, http(s) URL or scp host:path); empty reuses the build worktree's
        required: false
        default: ""
      build_only:
        description: Build and verify only without shipping to production
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: shenron-production-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build, verify and deploy Shenron image (linux-x64 -> prod)
    runs-on: [self-hosted, Linux, X64, shenron-factory]
    timeout-minutes: 120
    env:
      SHENRON_VFS_SOURCE: ${{ inputs.vfs }}
      # build-image.sh builds from a reusable worktree of this checkout (fetch + submodules).
      SHENRON_SOURCE_REPO: ${{ github.workspace }}
      SHENRON_BUILD_REPO: ${{ vars.SHENRON_BUILD_REPO }}
      SHENRON_DEPLOY_TARGET: ${{ vars.SHENRON_DEPLOY_TARGET || 'ssh:prod' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - name: Build, verify and deploy the image
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SHENRON_BUILD_REPO" ]; then unset SHENRON_BUILD_REPO; fi
          if [ -z "$SHENRON_VFS_SOURCE" ]; then unset SHENRON_VFS_SOURCE; fi
          if [ "${{ inputs.build_only }}" = "true" ]; then
            bash scripts/deploy/release.sh --build-only "$GITHUB_SHA"
          else
            bash scripts/deploy/release.sh "$GITHUB_SHA"
          fi
