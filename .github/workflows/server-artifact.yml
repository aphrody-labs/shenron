name: Production server artifact (no deploy)

# Build the production server and CDN assets on the actual VPS factory.
# Production promotion, host units and TLS routes belong to Aphrody Infra.
# Manual trusted execution only; never schedule pull-request code on this host.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-artifact-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: Build shenron-server (linux-x64, production)
    runs-on: [self-hosted, Linux, X64, shenron-factory, vps]
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # setup-bun reads the exact version from package.json#packageManager.
      - uses: oven-sh/setup-bun@v2

      - name: Cache Bun downloads only
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: server-artifact-bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install exact dependencies
        run: bun ci

      # Koharu WASM is tracked in Git and checked by rust.yml; the site needs no Rust build.
      - name: Build shenron-server and the CDN tree
        run: bun scripts/build/server.ts --target linux-x64 --flavor production

      - name: Package with checksums
        run: |
          mkdir -p artifacts
          cp dist/server/linux-x64/shenron-server artifacts/shenron-server-linux-x64
          tar -C dist -czf artifacts/shenron-cdn.tar.gz cdn
          cd artifacts
          sha256sum shenron-server-linux-x64 shenron-cdn.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Upload artifact only (never deploy)
        uses: actions/upload-artifact@v5
        with:
          name: shenron-server-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
