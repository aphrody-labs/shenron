name: Production server artifact (no deploy)

# Build the production server and CDN assets on the actual VPS factory, inside Aphrody's
# build image (`aphrody-build:latest`, scripts/build/container.ts): pinned Rust/Bun toolchain,
# shared cargo/sccache/Bun caches, bounded CPU and memory next to the host's model servers.
# Production promotion, host units and TLS routes belong to Aphrody Infra.
# Manual trusted execution only; never schedule pull-request code on this host.

on:
  workflow_dispatch:
    inputs:
      vfs:
        description: Public VFS on the factory host (public profile, checked by server.ts)
        required: true
        default: /home/shenron-build/data/shenron-vfs.public.sqlite

permissions:
  contents: read

concurrency:
  group: server-artifact-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: Build shenron-server (linux-x64, production)
    runs-on: [self-hosted, Linux, X64, shenron-factory, vps]
    timeout-minutes: 45
    env:
      VFS: ${{ inputs.vfs }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The host Bun only launches the container; the toolchain lives in the image.
      - name: Check the build image against this checkout
        run: bun scripts/build/container.ts --check

      # server.ts reads the public VFS from its default path inside the checkout.
      - name: Stage the public VFS
        run: install -D -m 0644 "$VFS" dist/vfs/shenron-vfs.public.sqlite

      - name: Install exact dependencies
        run: bun scripts/build/container.ts --target-volume shenron-ci -- bun ci

      # Koharu WASM is tracked in Git and checked by rust.yml; the site needs no Rust build.
      - name: Build shenron-server and the CDN tree
        run: >-
          bun scripts/build/container.ts --target-volume shenron-ci --
          bun scripts/build/server.ts --target linux-x64 --flavor production

      - name: Package with checksums
        run: |
          mkdir -p artifacts
          cp dist/server/linux-x64/shenron-server artifacts/shenron-server-linux-x64
          tar -C dist -czf artifacts/shenron-cdn.tar.gz cdn
          cd artifacts
          sha256sum shenron-server-linux-x64 shenron-cdn.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Upload artifact only (never deploy)
        uses: actions/upload-artifact@v5
        with:
          name: shenron-server-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
