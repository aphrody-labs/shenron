name: Production image build (no deploy)

# Build and verify the Shenron container image of this commit on a trusted self-hosted runner,
# through the release path's build step (scripts/deploy/build-image.sh). Shipping stays a
# separate, manual `scripts/deploy/release.sh --ship-only <sha>` on the build host.
# Manual trusted execution only; never schedule pull-request code on this host.

on:
  workflow_dispatch:
    inputs:
      vfs:
        description: Public VFS (local path, http(s) URL or scp host:path); empty reuses the build worktree's
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: server-artifact-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify the Shenron image (linux-x64)
    runs-on: [self-hosted, Linux, X64, shenron-factory]
    timeout-minutes: 120
    env:
      SHENRON_VFS_SOURCE: ${{ inputs.vfs }}
      # build-image.sh builds from a reusable worktree of this checkout (fetch + submodules).
      SHENRON_SOURCE_REPO: ${{ github.workspace }}
      SHENRON_BUILD_REPO: ${{ vars.SHENRON_BUILD_REPO }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - name: Build and verify the image (build only, never ship)
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SHENRON_BUILD_REPO" ]; then unset SHENRON_BUILD_REPO; fi
          if [ -z "$SHENRON_VFS_SOURCE" ]; then unset SHENRON_VFS_SOURCE; fi
          bash scripts/deploy/build-image.sh "$GITHUB_SHA"
