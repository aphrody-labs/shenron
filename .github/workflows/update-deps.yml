name: Update deps (weekly)

on:
  schedule:
    # Tous les lundis 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bun-update:
    name: bun update + PR
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DISCORD_TOKEN: test-token
      GUILD_ID: "1497167233280118896"
      OWNER_ID: "11111111111111111"
      DATABASE_PATH: "./data/test-ci.db"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun
      # Versions tierces : catalogue du package.json racine ; @aphrody/* épinglés exactement
      # (inchangés par bun update) ; minimumReleaseAge de bunfig.toml respecté.
      - name: Capture état avant
        run: cp bun.lock "$RUNNER_TEMP/bun.lock.before"

      - name: Update deps (semver-respecting)
        run: bun update

      # Mêmes portes que ci.yml.
      - name: Verify
        run: |
          bun --filter @aphrody/shenron-bot gen:entries
          bun packages/api/scripts/openapi.ts --check
          bun packages/ui/scripts/generate-tokens.ts --check
          bun packages/pipeline/scripts/ai/check-contracts.ts
          bun scripts/plugin/sync.ts --check
          bun check
          bun lint --no-n2b -c .oxlintrc.json apps packages scripts
          bun fmt --check apps packages scripts
          bun run test
          bun run test:scripts

      - name: Diff
        id: diff
        run: |
          if cmp -s "$RUNNER_TEMP/bun.lock.before" bun.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "summary<<__EOF__"
              echo "## Mises à jour appliquées"
              echo ""
              echo '```diff'
              diff -u "$RUNNER_TEMP/bun.lock.before" bun.lock | grep -E '^[-+] +"[^"]+": \["' | head -60 || true
              echo '```'
              echo ""
              echo "__EOF__"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/weekly-deps-update
          delete-branch: true
          title: "chore(deps): bun update hebdomadaire"
          commit-message: "chore(deps): bun update"
          body: |
            Mise à jour automatique des dépendances via `bun update` (respect semver).

            ${{ steps.diff.outputs.summary }}

            Type-check, lint, tests et contrôles de dérive passent dans ce job.

            _Si un conflit apparaît plus tard, fermer cette PR : elle est recréée lundi suivant._
          labels: dependencies,automated
