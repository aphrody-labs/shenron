name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DISCORD_TOKEN: test-token
  GUILD_ID: "1497167233280118896"
  OWNER_ID: "11111111111111111"
  DATABASE_PATH: "./data/test-ci.db"

jobs:
  check:
    name: Check (Bun)
    # Cible de prod = Linux. Les crates Rust (dépendances git épinglées sur Aphrody, socle ML)
    # ont leur workflow, rust.yml, actif quand le secret APHRODY_GIT_TOKEN est défini.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun
      - name: Cache ~/.bun
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install
        run: bun ci

      - name: Generate entries barrel
        run: bun --filter @shenron/bot gen:entries

      - name: OpenAPI document is up to date
        run: bun packages/api/scripts/openapi.ts --check

      - name: UI tokens are up to date
        run: bun packages/ui/scripts/generate-tokens.ts --check

      - name: Agent home template is embedded
        run: bun packages/db/scripts/agent-home-template.ts --check

      - name: CDN fonts are up to date
        run: bun apps/site/scripts/fonts.ts --check

      - name: AI contracts
        run: bun packages/pipeline/scripts/ai/check-contracts.ts

      - name: Workspace package graph and runtime classes
        run: bun scripts/audit/check-workspace-packages.ts --strict

      - name: Migrations (offline audit)
        run: bun run --filter @shenron/db audit:migrations

      - name: Plugin offline snapshots are up to date
        run: bun scripts/plugin/build-references.ts --check

      - name: Type-check
        run: bun run typecheck

      - name: Lint (oxlint)
        run: bun run lint

      # Les suites *.live.test.ts (services réels) restent hors CI : `bun run test:live`.
      - name: Tests
        run: bun run test

      - name: Tests des scripts racine
        run: bun run test:scripts
