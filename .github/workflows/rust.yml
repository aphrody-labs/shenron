# SPDX-License-Identifier: Apache-2.0
# Rust gates of the Cargo workspace (crates/*): rustfmt, clippy with warnings denied, nextest,
# koharu-canvas on wasm32, the generated [workspace.dependencies] block and cargo-deny.
#
# Infra provisions the trusted factory's toolchain and read-only dependency access.
# Only this repository's branches may execute on that host. Cargo compilation uses
# the qualified factory wrapper and its shared locks. See docs/development/rust.md.
name: Rust

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "clippy.toml"
      - "deny.toml"
      - ".cargo/config.toml"
      - ".config/nextest.toml"
      - "scripts/build/rust/**"
      - ".github/workflows/rust.yml"
  pull_request:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "clippy.toml"
      - "deny.toml"
      - ".cargo/config.toml"
      - ".config/nextest.toml"
      - "scripts/build/rust/**"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # No debug info on the runner: smaller target/ and caches.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  fmt:
    name: rustfmt
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, shenron-factory]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve the factory Rust toolchain
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # rust-toolchain.toml: channel, rustfmt and clippy, the three targets.
      - name: Toolchain
        run: rustup toolchain install
      # rustfmt reads the workspace members only: no dependency, no token.
      - name: cargo fmt --check
        run: cargo fmt --all --check

  check:
    name: Clippy, nextest, wasm32, deny
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, shenron-factory]
    timeout-minutes: 120
    env:
      RUSTC_WRAPPER: sccache
      # Runner variable SHENRON_CARGO_TARGET_DIR keeps target/ across jobs; default is per-workspace.
      CARGO_TARGET_DIR: ${{ vars.SHENRON_CARGO_TARGET_DIR || format('{0}/target', github.workspace) }}
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve qualified factory tools
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify factory readiness and dependency access
        run: |
          set -euo pipefail
          for tool in cargo rustup cargo-nextest cargo-deny sccache pkg-config clang cmake; do
            command -v "$tool" >/dev/null
          done
          pkg-config --exists gtk4 fontconfig dbus-1 openssl
          git ls-remote --exit-code https://github.com/aphrody-labs/aphrody.git HEAD >/dev/null

      - name: Toolchain
        run: rustup toolchain install

      # The factory's Cargo and sccache stores are managed by Infra, across jobs.
      - uses: ./.github/actions/setup-bun

      - name: Fetch (Cargo.lock)
        run: cargo fetch --locked

      # Reads Aphrody's workspace manifest from the git database Cargo just filled.
      - name: Generated [workspace.dependencies] is up to date
        run: bun scripts/build/rust/workspace-deps.ts --check

      - name: Clippy (cargo lint)
        run: bun scripts/build/rust/cargo.ts clippy --workspace --all-targets --locked -- -D warnings

      - name: Clippy, koharu feature (cargo koharu)
        run: >-
          bun scripts/build/rust/cargo.ts clippy -p shenron-manga -p shenron-cli -p shenron-mcp --all-targets --locked
          --features shenron-manga/koharu,shenron-cli/koharu,shenron-mcp/koharu -- -D warnings

      - name: koharu-canvas on wasm32 (cargo wasm)
        run: bun scripts/build/rust/cargo.ts check -p koharu-canvas --lib --target wasm32-unknown-unknown --locked

      # The committed module (packages/koharu/src/wasm/) matches its sources, Cargo.lock and
      # toolchain; rebuild it with `bun packages/koharu/scripts/build-wasm.ts` and commit it.
      - name: Committed koharu-canvas WASM is up to date
        run: bun packages/koharu/scripts/build-wasm.ts --check

      - name: Tests (nextest, ci profile)
        run: bun scripts/build/rust/cargo.ts nextest run --workspace --locked --profile ci

      - name: cargo-deny
        run: cargo deny --locked check

      - name: JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nextest-junit
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: sccache statistics
        if: always()
        run: sccache --show-stats
