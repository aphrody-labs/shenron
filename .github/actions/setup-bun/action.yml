# SPDX-License-Identifier: Apache-2.0
name: Setup Bun (aphrody-labs/bun fork)
description: >-
  Installs the Bun fork release pinned by package.json#packageManager
  (bun@<version> of aphrody-labs/bun), SHA256SUMS-checked.
runs:
  using: composite
  steps:
    - name: Resolve the fork release
      id: fork
      shell: bash
      run: |
        manager=$(sed -n 's/.*"packageManager": *"bun@\([^"]*\)".*/\1/p' package.json)
        [ -n "$manager" ] || { echo "package.json#packageManager must be bun@<version>" >&2; exit 1; }
        echo "tag=${manager}" >> "$GITHUB_OUTPUT"
    - name: Resolve the qualified factory runtime
      if: runner.environment == 'self-hosted'
      shell: bash
      env:
        SHENRON_EXPECTED_BUN: ${{ steps.fork.outputs.tag }}
      run: |
        set -euo pipefail
        candidate=$(command -v bun || true)
        if [ ! -x "$candidate" ]; then candidate="${BUN_INSTALL:-$HOME/.bun}/bin/bun"; fi
        native=$(realpath "$candidate")
        [ -x "$native" ] || { echo "Qualified factory Bun is unavailable" >&2; exit 1; }
        # Qualified native Linux x64 factory artifact, revision dfde053a3 (2026-10-13).
        printf '%s  %s\n' '890af6a675e1dc58b15a15777c53de3b2e82668690c9be5f6e87ec690246ac0e' "$native" | sha256sum -c -
        [ "$("$native" --revision)" = '1.4.4+dfde053a3' ] || { echo "Factory Bun revision differs" >&2; exit 1; }
        echo "$(dirname "$native")" >> "$GITHUB_PATH"
        echo "SHENRON_BUN_EXECUTABLE=$native" >> "$GITHUB_ENV"
    - name: Download the exact public owner runtime
      if: runner.environment != 'self-hosted'
      shell: bash
      env:
        SHENRON_EXPECTED_BUN: ${{ steps.fork.outputs.tag }}
      run: |
        set -euo pipefail
        case "$RUNNER_OS" in
          Linux) os=linux;; macOS) os=darwin;; Windows) os=windows;;
          *) echo "Unsupported native runtime platform" >&2; exit 1;;
        esac
        case "$RUNNER_ARCH" in
          X64) arch=x64;; ARM64) arch=aarch64;;
          *) echo "Unsupported native runtime architecture" >&2; exit 1;;
        esac
        [[ "$SHENRON_EXPECTED_BUN" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid pinned runtime version" >&2; exit 1; }
        asset="bun-$os-$arch"
        stage="$RUNNER_TEMP/shenron-native-bun-$GITHUB_RUN_ID-$RUNNER_OS-$RUNNER_ARCH"
        mkdir -p "$stage"
        base="https://github.com/aphrody-labs/bun/releases/download/bun-v$SHENRON_EXPECTED_BUN"
        curl -fsSL --retry 3 "$base/$asset.zip" -o "$stage/runtime.zip" || { echo "The exact public Aphrody runtime is unavailable" >&2; exit 1; }
        curl -fsSL --retry 3 "$base/SHA256SUMS.txt" -o "$stage/SHA256SUMS.txt"
        expected=$(awk -v name="$asset.zip" '$2 == name || $2 == "*" name { print $1 }' "$stage/SHA256SUMS.txt")
        if command -v sha256sum >/dev/null; then actual=$(sha256sum "$stage/runtime.zip" | cut -d ' ' -f 1); else actual=$(shasum -a 256 "$stage/runtime.zip" | cut -d ' ' -f 1); fi
        [[ "$expected" =~ ^[a-f0-9]{64}$ ]] && [ "$expected" = "$actual" ] || { echo "Owner runtime checksum differs" >&2; exit 1; }
        unzip -q "$stage/runtime.zip" -d "$stage"
        echo "$stage/$asset" >> "$GITHUB_PATH"
    - name: Verify the pinned native runtime
      shell: bash
      env:
        SHENRON_EXPECTED_BUN: ${{ steps.fork.outputs.tag }}
      run: |
        bun -e '
          const expected = process.env.SHENRON_EXPECTED_BUN;
          const source = process.release.sourceUrl ?? "";
          if (Bun.version !== expected || !source.startsWith("https://github.com/aphrody-labs/bun/releases/download/")) {
            throw new Error("The pinned Aphrody Bun runtime is unavailable; refusing a bootstrap fallback");
          }
          console.log(`Qualified Aphrody Bun ${Bun.version}`);
        '
    - name: Initialize the pinned configuration workspace
      shell: bash
      run: git submodule update --init -- packages/config
