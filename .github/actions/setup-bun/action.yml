# SPDX-License-Identifier: Apache-2.0
name: Setup Bun
description: >-
  Installs the official upstream Bun release pinned by package.json#packageManager
  (bun@<version> of oven-sh/bun) with oven-sh/setup-bun, pinned by commit.
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: package.json
    - name: Verify the pinned runtime
      shell: bash
      run: |
        expected=$(sed -n 's/.*"packageManager": *"bun@\([^"]*\)".*/\1/p' package.json)
        actual=$(bun --version)
        [ "$actual" = "$expected" ] || { echo "Bun $actual differs from the pinned $expected" >&2; exit 1; }
